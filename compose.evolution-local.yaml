services:
  redis-evolution:
    image: redis:7-alpine
    container_name: redis-evolution
    command: ["redis-server", "--appendonly", "yes", "--port", "6379"]
    ports:
      - "6380:6379" # Different port to avoid conflict
    volumes:
      - redis_evolution_data:/data
    networks:
      - trajetto-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      redis-evolution:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - trajetto-network
    env_file:
      - .env
    environment:
      # 🚀 Server Settings - Optimized
      SERVER_URL: ${EVOLUTION_API_URL}
      DEL_INSTANCE: false

      # 📱 Session Settings - Minimal
      CONFIG_SESSION_PHONE_CLIENT: Windows
      CONFIG_SESSION_PHONE_NAME: Chrome
      CONFIG_SESSION_PHONE_VERSION: 2.3000.1023204200

      # ⚙️ General Settings - Essential Only
      QRCODE_LIMIT: 5
      LANGUAGE: pt-BR

      # 📋 Message Settings - Prevent Auto-Read
      AUTO_READ_MESSAGES: false
      MARK_MESSAGES_READ: false
      READ_MESSAGES: false
      READ_STATUS: false

      # 🔐 Authentication
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: true

      # 🗄️ Database - Minimal Saving (Only Essential)
      DATABASE_ENABLED: true
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@trajetto-database:5432/evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: evolution_v2
      DATABASE_SAVE_DATA_INSTANCE: true
      DATABASE_SAVE_DATA_NEW_MESSAGE: false # ❌ Disabled - Resource heavy
      DATABASE_SAVE_MESSAGE_UPDATE: false # ❌ Disabled - Not needed
      DATABASE_SAVE_DATA_CONTACTS: false # ❌ Disabled - Not needed
      DATABASE_SAVE_DATA_CHATS: false # ❌ Disabled - Not needed
      DATABASE_SAVE_DATA_LABELS: false # ❌ Disabled - Not needed
      DATABASE_SAVE_DATA_HISTORIC: false # ❌ Disabled - Resource heavy

      # 📦 Redis Cache - Optimized
      CACHE_REDIS_ENABLED: true
      CACHE_REDIS_URI: redis://redis-evolution:6379/1
      CACHE_REDIS_PREFIX_KEY: trajetto_evolution
      CACHE_REDIS_SAVE_INSTANCES: true
      CACHE_LOCAL_ENABLED: false

      # 🌐 Webhook - Smart Filtering
      WEBHOOK_GLOBAL_URL: ${EVOLUTION_API_URL}/evolution/webhook
      WEBHOOK_GLOBAL_ENABLED: true
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: true

      # 🚫 Disabled Services (Resource Optimization)
      PROVIDER_ENABLED: false
      RABBITMQ_ENABLED: false
      SQS_ENABLED: false
      WEBSOCKET_ENABLED: false
      WEBSOCKET_GLOBAL_EVENTS: false
      TYPEBOT_ENABLED: true
      TYPEBOT_API_VERSION: latest
      CHATWOOT_ENABLED: false
      OPENAI_ENABLED: false
      DIFY_ENABLED: false
      S3_ENABLED: false

      # 💼 WhatsApp Business Settings
      WA_BUSINESS_TOKEN_WEBHOOK: evolution
      WA_BUSINESS_URL: https://graph.facebook.com
      WA_BUSINESS_VERSION: v20.0
      WA_BUSINESS_LANGUAGE: pt_BR

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080",
          "||",
          "exit",
          "1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  redis_evolution_data:
    driver: local
  evolution_instances:
    driver: local

networks:
  trajetto-network:
    driver: bridge
