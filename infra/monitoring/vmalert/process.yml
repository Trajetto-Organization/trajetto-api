# Generated by `yarn monitoring:render` from infra/monitoring/monitoring-config.ts: edit that file, never this one.
# What only the scrape sees, replica by replica: docs/slo.md's fixed
# thresholds and the stack's own health. Observation first (severity warn).
groups:
  - name: trajetto-process
    interval: 1m
    rules:
      - alert: TrajettoMetricsTargetDown
        expr: |-
          up{job=~"trajetto-.+"} == 0
        for: 3m
        labels:
          severity: warn
          source: metrics
        annotations:
          summary: "Réplica sem /metrics: fora do ar, METRICS_PORT diferente ou token recusado"
          runbook: "infra/monitoring/README.md#um-alvo-fora"
      - alert: TrajettoAlertVerdictStale
        expr: |-
          time() - max by (env) (trajetto_alert_evaluated_timestamp_seconds) > 300
        for: 2m
        labels:
          severity: warn
          source: metrics
        annotations:
          summary: "Nenhum processo julgou os alertas há mais de 5 min: o heartbeat de operação parou"
          runbook: "infra/monitoring/README.md#heartbeat-parado"
      - alert: TrajettoEventLoopBusy
        expr: |-
          avg_over_time(trajetto_event_loop_utilization[5m]) > 0.8
        for: 5m
        labels:
          severity: warn
          source: metrics
        annotations:
          summary: "Event loop ocupado acima de 80% por 5 min"
          runbook: "docs/runbooks/load-shedding.md"
      - alert: TrajettoEventLoopLag
        expr: |-
          trajetto_event_loop_lag_p99_seconds > 0.2
        for: 5m
        labels:
          severity: warn
          source: metrics
        annotations:
          summary: "Atraso p99 do event loop acima de 200 ms"
          runbook: "docs/runbooks/load-shedding.md"
      - alert: TrajettoDbPoolWaiting
        expr: |-
          trajetto_db_pool_connections{pool="waiting"} > 0
        for: 1m
        labels:
          severity: warn
          source: metrics
        annotations:
          summary: "Requisições esperando conexão do pool do Prisma há 1 min"
          runbook: "docs/runbooks/connection-usage-high.md"
      - alert: TrajettoMetricsRefusedSeries
        expr: |-
          trajetto_metrics_refused_series > 0
        for: 0s
        labels:
          severity: warn
          source: metrics
        annotations:
          summary: "O /metrics recusou uma série: um rótulo fora da lista ou com cara de empresa ou pessoa"
          runbook: "infra/monitoring/README.md#série-recusada"
