# Generated by `yarn monitoring:render` from infra/monitoring/monitoring-config.ts: edit that file, never this one.
# One rule per code of ALERT_KINDS (src/shared/health/alert-rules.ts): the
# verdict of the ops heartbeat, newest per environment. The thresholds live
# in the code, never here.
groups:
  - name: trajetto-alert-codes
    interval: 1m
    rules:
      - alert: TrajettoOutboxLag
        expr: |-
          max by (env, code) (
            trajetto_alert_active{code="outbox-lag"}
            and on (env, job, instance) (
              trajetto_alert_evaluated_timestamp_seconds
              == on (env) group_left ()
              max by (env) (trajetto_alert_evaluated_timestamp_seconds)
            )
            and on (env, job, instance) (
              time() - trajetto_alert_evaluated_timestamp_seconds < 300
            )
          ) == 1
        for: 1m
        labels:
          severity: page
          source: ops-heartbeat
        annotations:
          summary: "Outbox parado"
          runbook: "docs/runbooks/outbox-lag.md"
