# Generated by `yarn monitoring:render` from infra/monitoring/monitoring-config.ts: edit that file, never this one.
# The vmagent of one environment: every series it ships carries
# env=<environment> (-remoteWrite.label), and each Application has its
# own job file in /etc/vmagent/jobs.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
scrape_config_files:
  - /etc/vmagent/jobs/*.yml
