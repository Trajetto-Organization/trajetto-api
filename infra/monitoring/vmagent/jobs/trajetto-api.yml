# Generated by `yarn monitoring:render` from infra/monitoring/monitoring-config.ts: edit that file, never this one.
# The Application trajetto-api (PROCESS_ROLE all or api).
# Mount it in the vmagent only while that Application exists.
- job_name: trajetto-api
  scheme: http
  metrics_path: /metrics
  sample_limit: 5000
  authorization:
    type: Bearer
    credentials: "%{METRICS_TOKEN}"
  dns_sd_configs:
    - names:
        - "tasks.%{TRAJETTO_API_APP_NAME}"
      type: A
      port: 9464
  metric_relabel_configs:
    - source_labels: [__name__]
      regex: trajetto_.+
      action: keep
