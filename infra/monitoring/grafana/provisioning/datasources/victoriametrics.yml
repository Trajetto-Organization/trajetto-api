# Generated by `yarn monitoring:render` from infra/monitoring/monitoring-config.ts: edit that file, never this one.
# $VICTORIA_METRICS_URL, $VICTORIA_METRICS_USER and $VICTORIA_METRICS_PASSWORD
# come from the Grafana Application's Environment.
apiVersion: 1
datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: $VICTORIA_METRICS_URL
    isDefault: true
    editable: false
    basicAuth: true
    basicAuthUser: $VICTORIA_METRICS_USER
    jsonData:
      timeInterval: 30s
      httpMethod: POST
    secureJsonData:
      basicAuthPassword: $VICTORIA_METRICS_PASSWORD
