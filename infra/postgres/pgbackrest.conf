# pgBackRest configuration of the trajetto-postgres image (plano-escala F1-01).
#
# No secret here. The repository's keys and the cipher passphrase come from
# the Database's Environment (PGBACKREST_REPO1_S3_ENDPOINT, _S3_BUCKET,
# _S3_KEY, _S3_KEY_SECRET, _CIPHER_PASS), which pgBackRest reads by itself;
# an environment variable also wins over any line below. The per-start
# values (pg1-path, pg1-user, the archive queue cap) are in
# conf.d/runtime.conf, written by trajetto-entrypoint.sh.
#
# A second repository (repo2) is optional and comes whole from the
# environment (PGBACKREST_REPO2_*): nothing for it here, or pgBackRest would
# take it as configured.

[global]
# Cloudflare R2 through its S3 API. pgBackRest has no official R2 page: the
# F1a on staging is what proves it (plano-escala F1-O2).
repo1-type=s3
repo1-s3-region=auto
repo1-s3-uri-style=path
# At the bucket's root, so the write-once prefixes are archive/trajetto/ and
# backup/trajetto/ (the Bucket Lock rules, plano-escala F1-26).
repo1-path=/
repo1-cipher-type=aes-256-cbc
# 30 days of fulls, and the WAL they need. Longer than the 14-day Bucket
# Lock, so expire only deletes what the lock already let go.
repo1-retention-full-type=time
repo1-retention-full=30
compress-type=zst

# What a backup or a check says goes to the Schedule Job's output; nothing
# is written under /var/log in the container.
log-level-console=info
log-level-file=off
# The full of Saturday 05:00 UTC starts right away instead of waiting up to
# a checkpoint_timeout (15 min) for the next checkpoint.
start-fast=y

[global:archive-push]
# Once a minute at least: only warnings and errors reach the Postgres log
# (a dropped segment is a warning).
log-level-console=warn

[trajetto]
pg1-socket-path=/var/run/postgresql
