# pg_hba.conf of the trajetto-postgres image (plano-escala F4-40).
#
# The rules the official image writes on a new volume, and nothing else:
# initdb's defaults (trust only inside the container, on the socket and the
# loopback) plus the line docker-entrypoint.sh appends (every address, with
# the volume's password_encryption, scram-sha-256). A database migrated to
# this image accepts the same connections it accepted before
# (infra/postgres/test/run.sh compares these rules with the volume's own
# file, written by the official entrypoint).
#
# Versioned with the image, never edited on the volume: trajetto-entrypoint.sh
# copies it to /etc/trajetto/run/pg_hba.conf at every start and points
# hba_file at the copy, so rolling the digest back rolls the rules back and
# the volume's own file is used again.
#
# Replication from the network is NOT here. "all" in the DATABASE column
# never matches a replication connection, so the standby gets in only
# through the one line the entrypoint appends for POSTGRES_REPLICATION_CIDR:
# `host replication trajetto_replication <cidr> scram-sha-256`, never for
# "all", and no line when the variable is empty.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    all             all             all                     scram-sha-256
