# O balanceador que não existe em desenvolvimento e existe em produção.
#
# Mínimo de propósito: round-robin sobre as réplicas, sem cache, sem
# compressão, sem keepalive exótico. Qualquer coisa a mais e a medição passa a
# ser do nginx.
upstream trajetto {
    server host.docker.internal:3341;
    server host.docker.internal:3342;

    # Uma conexão reaproveitada por réplica, senão cada requisição do k6 abre
    # um socket novo e o teste mede o handshake.
    keepalive 64;
}

server {
    listen 8080;

    # O tamanho do corpo que a rota de upload local aceita; sem isso o nginx
    # recusa antes da API e a medição vira a do nginx.
    client_max_body_size 25m;

    location / {
        proxy_pass http://trajetto;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Generoso: o ponto do teste é onde a APLICAÇÃO satura, não onde o
        # proxy desiste.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
