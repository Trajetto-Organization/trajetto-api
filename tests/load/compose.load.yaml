# The load harness: production's topology on one machine.
#
# Production is Dokploy + Traefik in front of N replicas of the API IMAGE
# (NODE_ENV=production, memory-capped), sharing one Postgres and one Redis.
# This file is that shape, locally: Traefik v3 (the docker provider instead of
# swarm) with the same readiness check the production labels declare, the
# production image built from ../../Dockerfile, the same memory ceilings, and
# k6 inside the same Docker network — so a run measures the application and not
# the WSL2/Windows boundary a host process sits behind (tests/load/README.md).
#
# It is NOT production: plain HTTP (host port 8080), PathPrefix instead of Host(),
# fake R2 credentials (no scenario uploads; nothing ever reaches R2) and no
# backup. The nginx config that used to sit here was a harness too, and
# represented nothing that runs anywhere.
#
#   docker compose --env-file .env -f tests/load/compose.load.yaml up -d --build
#   (seed: tests/load/README.md, "Como rodar")
#   docker compose --env-file .env -f tests/load/compose.load.yaml --profile k6 run --rm k6 run /load/smoke.js
#
# --env-file .env: the replicas verify the tokens tests/load/seed.ts signed, so
# they need the same JWT_SECRET pair; nothing else is read from it.
#
# Boot order is production's release order: `migrate` prepares load_test once
# (the release image, trajetto-api-migrate — Dockerfile stage `migrate` —
# what the Dokploy Application trajetto-api-migrate runs before a rollout),
# and the replicas start only after it exits 0. The API image never migrates: it
# runs NODE_ENV=production, the bootstrap guard of production refuses an
# EMPTY database (infra/scripts/database-bootstrap-guard.ts) and the schema
# guard refuses one without the build's migrations
# (infra/scripts/schema-guard.ts): started first, every replica exited on
# the fresh volume.
#
# The roles of the same image (plano-escala F3-01, LOAD-01). Without a
# profile, the harness is the one above: N replicas in PROCESS_ROLE=all,
# each running everything, as production does until wave 14. Two profiles
# add the split fleet:
#
#   roles     the worker (PROCESS_ROLE=worker, LOAD_WORKER_REPLICAS, 1):
#             every queue and the cron. With LOAD_API_ROLE=api the replicas
#             behind Traefik stop claiming and running the cron, which is
#             staging's phase B and production's phase C:
#               LOAD_API_ROLE=api docker compose --env-file .env \
#                 -f tests/load/compose.load.yaml --profile roles up -d --build
#             (api ×2 without workers, worker ×1; multi-replica.sh steps 6
#             to 8 check it, and fail if LOAD_API_ROLE was forgotten);
#   realtime  the sockets' role (PROCESS_ROLE=realtime) behind Traefik on
#             /socket.io, as the Domain with Path of wave 18; with
#             LOAD_API_SOCKETS=false the api replicas refuse sockets.
#
# A profile cannot change another service's settings, so the api's role is
# the variable LOAD_API_ROLE and not the profile itself.
#
# The queue and import scenes (plano-escala LOAD-04): LOAD_WORKER_QUEUES
# narrows the worker's queues (empty: the role's preset, every queue), so a
# process outside the harness can be the only consumer of the external
# lane (queue-flood.ts); Redis answers on 127.0.0.1:LOAD_REDIS_PORT (56379)
# for that process; and the `fakes` profile adds the fake geocoder
# (fake-geocoder.mjs, the Startup plan's limits, over HTTPS with a CA of
# its own in the fakes-ca volume), which the replicas and the worker call
# only with LOAD_API_ENV_FILE=geocoder-startup.env, an env file of the
# API's own variables that also points NODE_EXTRA_CA_CERTS at that CA.
# Without the file, no geocoder and no CA trusted, as before.
#
# Swappable images: LOAD_API_IMAGE, LOAD_WORKER_IMAGE and
# LOAD_REALTIME_IMAGE (the last two default to the first) run a mixed
# fleet, as during a rolling deploy: build once, then `up` WITHOUT
# --build, or compose builds this tree under the tag given.
#
# Pinned CPU: every service takes a cpuset from LOAD_<SERVICE>_CPUSET
# (empty: no pinning). tests/load/vps-6vcpu.env puts the whole stack on
# cores 0-5, like the single VPS's 6 vCPU, and k6 outside them. The cpuset
# imitates cores, not the VPS's steal: the bench's numbers are indicative.
name: trajetto-load

# The replicas' environment, shared with `migrate` so the release step sees
# the same database and secrets.
x-api-environment: &api-environment
  NODE_ENV: production
  # Neither staging nor production: a laptop running the production image.
  APP_ENV: development
  NODE_OPTIONS: --max-old-space-size=${API_HEAP_MB:-768}
  DATABASE_URL: postgresql://trajetto:${LOAD_PG_PASSWORD:-trajetto-password}@postgres:5432/load_test?schema=public&connection_limit=10&pool_timeout=20&connect_timeout=5
  MIGRATION_DATABASE_URL: postgresql://trajetto:${LOAD_PG_PASSWORD:-trajetto-password}@postgres:5432/load_test?schema=public&connection_limit=2
  REDIS_URL: redis://redis:6379
  HTTP_REQUEST: http://localhost:3000
  API_HTTP_REQUEST: http://localhost:${LOAD_EDGE_PORT:-8080}
  JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET (o mesmo que assinou os tokens do seed)}
  JWT_SECRET_REFRESH_TOKEN: ${JWT_SECRET_REFRESH_TOKEN:?Defina JWT_SECRET_REFRESH_TOKEN}
  MASTER_USER_EMAIL: load-master@example.com
  MASTER_USER_INITIAL_PASSWORD: load-harness-only
  # Production refuses local storage. The mix never uploads, so these are
  # never used; the S3 client only signs URLs locally.
  UPLOAD_STORAGE_TYPE: r2
  R2_ACCOUNT_ID: load-harness
  R2_BUCKET_NAME: load-harness
  R2_ACCESS_KEY_ID: load-harness
  R2_SECRET_ACCESS_KEY: load-harness
  UPLOAD_ORPHAN_GC: "off"
  # Traefik IS the edge here (no Cloudflare): the peer it appends to
  # X-Forwarded-For is k6's container.
  RATE_LIMIT_TRUSTED_PROXY: xff
  # The replicas' role (plano-escala F3-01): `all` by default, every queue
  # and the cron in each replica, exactly the WORKERS_ENABLED=true this
  # used to say; `api` with the roles profile. The worker and the realtime
  # services set their own. Empty SOCKETS_ENABLED is the role's preset.
  PROCESS_ROLE: ${LOAD_API_ROLE:-all}
  SOCKETS_ENABLED: ${LOAD_API_SOCKETS:-}

services:
  traefik:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    cpuset: ${LOAD_TRAEFIK_CPUSET:-}
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=trajetto-load-edge
      # :80 inside; Traefik's own entrypoint (ping) takes :8080.
      - --entrypoints.web.address=:80
      # The production value (infra/traefik/traefik.reference.yaml), not
      # Traefik's 60 s default: the harness has to cut what production cuts.
      - --entrypoints.web.transport.respondingtimeouts.readtimeout=120s
      # One JSON line per request, with the replica that answered
      # (ServiceURL): multi-replica.sh counts them to prove the split.
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      - --ping=true
    ports:
      - "127.0.0.1:${LOAD_EDGE_PORT:-8080}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - edge

  # The release step, once, before any replica: migrations and the idempotent
  # seeds, strictly, then exit. ALLOW_EMPTY_DATABASE_BOOTSTRAP only here:
  # load_test starts empty on purpose, and the replicas keep the guard.
  # The release image is the API image plus the Prisma CLI, the migrations
  # and the seeds: built from the same Dockerfile, target `migrate`, on top
  # of the `api` build below. `migrate`, not the image's default `release`
  # (which stays up to report to Swarm): the replicas wait for this service
  # to EXIT successfully.
  migrate:
    image: ${LOAD_MIGRATE_IMAGE:-trajetto-api-migrate:load}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migrate
    command: ["./docker-entrypoint.sh", "migrate"]
    cpuset: ${LOAD_API_CPUSET:-}
    environment:
      <<: *api-environment
      ALLOW_EMPTY_DATABASE_BOOTSTRAP: "true"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  api:
    image: ${LOAD_API_IMAGE:-trajetto-api:load}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
    cpuset: ${LOAD_API_CPUSET:-}
    deploy:
      replicas: ${LOAD_REPLICAS:-2}
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1024M}
    environment:
      <<: *api-environment
      # Node flags for the api replicas alone (plano-escala LOAD-10):
      # cpu-profile.sh recreates them with --cpu-prof here, and the
      # migrate, worker and realtime never see it. Unset, the value is the
      # anchor's, to the character.
      NODE_OPTIONS: --max-old-space-size=${API_HEAP_MB:-768}${LOAD_API_NODE_FLAGS:+ ${LOAD_API_NODE_FLAGS:-}}
    # The API's own variables for one scene (LOAD-04): read only when the
    # file is named, never required.
    env_file:
      - path: ${LOAD_API_ENV_FILE:-no-extra.env}
        required: false
    # The fake geocoder's CA, read only through the env file's
    # NODE_EXTRA_CA_CERTS; empty without the fakes profile.
    volumes:
      - fakes-ca:/fakes:ro
    # Each replica also on its own loopback port (the first free one of the
    # range), for the questions that must hit a SPECIFIC replica: the shared
    # rate limit and a socket event crossing replicas (multi-replica.sh).
    ports:
      - "127.0.0.1:3341-3350:3333"
    # Port 3333 and the readiness check per replica, so an unready replica
    # leaves rotation. Production runs as a Dokploy Application behind
    # Dokploy's Traefik (docs/deploy.md says what its routing does and does
    # not do per replica); compose-load-harness.test.ts pins these labels.
    labels:
      - traefik.enable=true
      - traefik.http.routers.load-api.rule=PathPrefix(`/`)
      - traefik.http.routers.load-api.entrypoints=web
      - traefik.http.routers.load-api.service=load-api
      - traefik.http.services.load-api.loadbalancer.server.port=3333
      - traefik.http.services.load-api.loadbalancer.passHostHeader=true
      - traefik.http.services.load-api.loadbalancer.healthcheck.path=/health/readiness
      - traefik.http.services.load-api.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.load-api.loadbalancer.healthcheck.timeout=5s
    depends_on:
      # After the release step, never beside it: see the header.
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # With the fakes profile, after the fake wrote its CA: the trust is
      # read once, when Node starts.
      fake-geocoder:
        condition: service_healthy
        required: false
    networks:
      - edge
      - data

  # The worker of the split fleet (profile `roles`): the same image in
  # PROCESS_ROLE=worker, every queue and the cron, sweeping every 2 s (the
  # preset) and woken by the api's hints over Redis (F3-04). No route in
  # Traefik: its HTTP surface is /health only, for the image's healthcheck.
  # Phase C's ceilings by default (section 3 of the plan): 1 × 1024 MiB with
  # a 512 heap; LOAD_WORKER_CPUS caps it (1.5 in phase C; empty, none).
  worker:
    profiles: ["roles"]
    image: ${LOAD_WORKER_IMAGE:-${LOAD_API_IMAGE:-trajetto-api:load}}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
    cpuset: ${LOAD_WORKER_CPUSET:-}
    deploy:
      replicas: ${LOAD_WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: ${LOAD_WORKER_MEMORY_LIMIT:-1024M}
          cpus: ${LOAD_WORKER_CPUS:-0}
    environment:
      <<: *api-environment
      PROCESS_ROLE: worker
      SOCKETS_ENABLED: ""
      WORKER_QUEUES: ${LOAD_WORKER_QUEUES:-}
      NODE_OPTIONS: --max-old-space-size=${LOAD_WORKER_HEAP_MB:-512}
    env_file:
      - path: ${LOAD_API_ENV_FILE:-no-extra.env}
        required: false
    volumes:
      - fakes-ca:/fakes:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fake-geocoder:
        condition: service_healthy
        required: false
    networks:
      - data

  # The sockets' role (profile `realtime`, wave 18 of the plan): the same
  # image in PROCESS_ROLE=realtime, which Traefik reaches on /socket.io
  # before the api's catch-all, the way the Domain with Path does in
  # Dokploy. The scenes connect over WebSocket only, so one connection
  # stays on one replica without a sticky cookie.
  realtime:
    profiles: ["realtime"]
    image: ${LOAD_REALTIME_IMAGE:-${LOAD_API_IMAGE:-trajetto-api:load}}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
    cpuset: ${LOAD_REALTIME_CPUSET:-}
    deploy:
      replicas: ${LOAD_REALTIME_REPLICAS:-1}
      resources:
        limits:
          memory: ${LOAD_REALTIME_MEMORY_LIMIT:-512M}
    environment:
      <<: *api-environment
      PROCESS_ROLE: realtime
      SOCKETS_ENABLED: ""
      NODE_OPTIONS: --max-old-space-size=${LOAD_REALTIME_HEAP_MB:-320}
    labels:
      - traefik.enable=true
      - traefik.http.routers.load-realtime.rule=PathPrefix(`/socket.io`)
      - traefik.http.routers.load-realtime.priority=100
      - traefik.http.routers.load-realtime.entrypoints=web
      - traefik.http.routers.load-realtime.service=load-realtime
      - traefik.http.services.load-realtime.loadbalancer.server.port=3333
      - traefik.http.services.load-realtime.loadbalancer.passHostHeader=true
      - traefik.http.services.load-realtime.loadbalancer.healthcheck.path=/health/readiness
      - traefik.http.services.load-realtime.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.load-realtime.loadbalancer.healthcheck.timeout=5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - data

  # The disposable database: 54321, the port tests/load/seed.ts insists on,
  # so the seed can never touch a real one. Stop trajetto-itest-pg first if
  # it holds the port (or set LOAD_PG_PORT and seed through that).
  #
  # Production's own image (infra/postgres, plano-escala F1-04): the same
  # wrapper, the same static parameters (jit off, no parallel workers,
  # pg_stat_statements preloaded) and all the memory derived from the cap,
  # with POSTGRES_MEMORY_LIMIT_MB equal to the container's limit — 2048 MiB,
  # production's on the single VPS (LOAD_PG_MEMORY_MB to measure another
  # step). No PITR_ARCHIVE: archiving stays off, as the wrapper writes it.
  # The extra flag below goes last, as the Database's Args would.
  postgres:
    build:
      context: ../../infra/postgres
    command: ["postgres", "-c", "pg_stat_statements.track=all"]
    cpuset: ${LOAD_PG_CPUSET:-}
    environment:
      POSTGRES_USER: trajetto
      POSTGRES_PASSWORD: ${LOAD_PG_PASSWORD:-trajetto-password}
      POSTGRES_DB: load_test
      POSTGRES_MEMORY_LIMIT_MB: ${LOAD_PG_MEMORY_MB:-2048}
    deploy:
      resources:
        limits:
          memory: ${LOAD_PG_MEMORY_MB:-2048}M
    ports:
      - "127.0.0.1:${LOAD_PG_PORT:-54321}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trajetto -d load_test"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data

  # As production runs it: nothing persisted, evicting instead of refusing.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    cpuset: ${LOAD_REDIS_CPUSET:-}
    # On loopback for the scenes that run a process outside the harness
    # (queue-flood.ts, LOAD-04).
    ports:
      - "127.0.0.1:${LOAD_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data

  # The geocoding provider's stand-in (profile `fakes`, LOAD-04): the
  # Nominatim-compatible /search with the Startup plan's limits, and /stats
  # for the import-geocode scene. Nothing of a load run reaches a real
  # provider. HTTPS, because production refuses a geocoder URL that is not:
  # it mints a CA of one run with the repository's node-forge and writes it
  # to fakes-ca once it listens, which is what the healthcheck waits for.
  # The burn-in's pinned Node image, tests/load read-only.
  fake-geocoder:
    profiles: ["fakes"]
    image: node:22.21.1-alpine3.23@sha256:0340fa682d72068edf603c305bfbc10e23219fb0e40df58d9ea4d6f33a9798bf
    command: ["node", "/load/fake-geocoder.mjs"]
    environment:
      FAKE_GEOCODER_PER_SECOND: ${LOAD_FAKE_GEOCODER_PER_SECOND:-22}
      FAKE_GEOCODER_PER_DAY: ${LOAD_FAKE_GEOCODER_PER_DAY:-60000}
      FAKE_GEOCODER_LATENCY_MS: ${LOAD_FAKE_GEOCODER_LATENCY_MS:-150}
      FAKE_GEOCODER_TLS_DIR: /fakes
      FAKE_GEOCODER_FORGE: /forge
      FAKE_GEOCODER_HOSTS: fake-geocoder,localhost
    volumes:
      - ./:/load:ro
      - ../../node_modules/node-forge:/forge:ro
      - fakes-ca:/fakes
    healthcheck:
      test: ["CMD-SHELL", "test -s /fakes/ca.pem"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - edge
      - data

  # On demand only (`--profile k6 run --rm k6 run /load/<scene>.js`): k6 on
  # the same network as Traefik, so no request crosses into Windows.
  k6:
    image: grafana/k6:2.2.0@sha256:9bd01d6941fca969cb61bb57d2da5ee9b385fe2aa8881df3798c196564d6ace6
    profiles: ["k6"]
    # Outside the stack's cores with tests/load/vps-6vcpu.env: the
    # generator must not take the CPU it measures.
    cpuset: ${LOAD_K6_CPUSET:-}
    environment:
      LOAD_BASE_URL: http://traefik
    volumes:
      - ./:/load:ro
    depends_on:
      traefik:
        condition: service_healthy
    networks:
      - edge

volumes:
  # The fake geocoder's CA of the run (profile `fakes`); empty otherwise.
  fakes-ca:

networks:
  # Traefik, the replicas and k6. Named, so the provider flag above holds
  # whatever project name compose is given.
  edge:
    name: trajetto-load-edge
  # The replicas, Postgres and Redis.
  data:
