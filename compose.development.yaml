version: "3.8"

services:
  trajetto-database:
    image: "bitnami/postgresql"
    container_name: trajetto-database
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env # Loads the base variables
    environment:
      # Use .env variables to configure PostgreSQL
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/bitnami/postgresql
    networks:
      - trajetto-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  trajetto-redis:
    image: redis:7-alpine
    container_name: trajetto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  trajetto-rabbitmq:
    image: "rabbitmq:3-management"
    container_name: trajetto-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672" # Connection
      - "15672:15672" # UI
    env_file:
      - .env
    environment:
      # Use .env variables to configure RabbitMQ
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - trajetto-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  trajetto-network:
    driver: bridge
