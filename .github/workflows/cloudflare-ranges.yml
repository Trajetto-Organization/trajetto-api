name: Cloudflare ranges

# Every Monday, Cloudflare's edge as written in src/config/trusted-edge.ts
# against the list Cloudflare publishes
# (.github/scripts/check-cloudflare-ranges.mjs). The IPv4 half is also the
# origin firewall's allowlist (Contabo, ports 80 and 443, docs/deploy.md
# section 6.1). A red run e-mails the schedule's owner with the ranges to add
# or remove, before a change turns into 522s.
on:
  schedule:
    # 06:00 in São Paulo.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# `bash -eo pipefail` for every `run:`, as in the other workflows.
defaults:
  run:
    shell: bash

jobs:
  ranges:
    name: Cloudflare ranges
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the list and the check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            src/config

      # The same Node as every other job (the Dockerfile base), not the
      # runner's default, which moves with the runner image.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.21.1"

      - name: Compare with the published ranges
        run: node .github/scripts/check-cloudflare-ranges.mjs
