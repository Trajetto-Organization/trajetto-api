name: CI (branches)

# Portao rapido de branch. Roda em toda branch que NAO seja a main/master, para
# o problema aparecer antes do PR — e nao depois, no meio da pipeline pesada.
#
# De proposito ficam de fora: E2E (precisa de postgres/rabbitmq/redis de pe),
# build da imagem, release e deploy. Tudo isso e responsabilidade do deploy.yml
# quando o codigo chega na main. Aqui a pergunta e uma so: esse codigo esta
# saudavel o bastante para virar PR?
on:
  push:
    branches-ignore: [main, master]
  workflow_dispatch:

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  RABBITMQ_URL: amqp://guest:guest@localhost:5672
  REDIS_URL: redis://localhost:6379
  HTTP_REQUEST: http://localhost:3000
  API_HTTP_REQUEST: http://localhost:3333
  JWT_SECRET: test-jwt-secret-key-for-github-actions-only
  JWT_SECRET_REFRESH_TOKEN: test-jwt-refresh-secret-key-for-github-actions-only
  EVOLUTION_API_URL: http://localhost:8080/test
  EVOLUTION_API_KEY: test-evolution-api-key
  EVOLUTION_HTTP_REQUEST: http://localhost:3333
  TRAJETTO_WHATSAPP_BUSINESS_PHONE: 5524999999999
  TRAJETTO_WHATSAPP_INSTANCE_NAME: Trajetto-Business-Test
  UPLOAD_STORAGE_TYPE: local
  UPLOAD_LOCAL_PATH: ./tmp
  MASTER_USER_EMAIL: test-master@example.com
  MASTER_USER_INITIAL_PASSWORD: test-master-password-ci-only

jobs:
  validate:
    name: Lint, type-check and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Primeiro passo de verificacao: e o mais barato de todos. Nao faz sentido
      # gastar minutos em tsc e vitest se o codigo nem esta formatado.
      - name: Lint
        run: yarn lint:check

      # Sem o client gerado o tsc nao acha os tipos do @prisma/client e o job
      # quebra com centenas de erros falsos.
      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Type-check
        run: yarn typecheck

      - name: Create tmp directory
        run: mkdir -p src/tmp

      - name: Run unit tests
        run: yarn test --run --reporter=basic
