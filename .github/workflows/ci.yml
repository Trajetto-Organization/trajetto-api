name: CI

# Every push to a work branch — anything but staging and main — so that a
# problem surfaces before the code reaches staging (docs/deploy.md). The
# same validation as staging (validate.yml), without the E2E suite, which
# runs here only on Run workflow (e2e): every push to staging runs it whole
# before anything is built. Run workflow also runs the AI local contract.
# No image, release or deploy here.
#
# A change that spans the repositories goes on a branch of the SAME name in
# each one: the route contract (.github/actions/siblings, "Pick the sibling
# branches") tests this branch against the web and the app of that name.
on:
  push:
    branches-ignore: [main, master, staging]
  workflow_dispatch:
    inputs:
      e2e:
        description: "Roda também o E2E inteiro (3 jobs em paralelo)"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless: the newer
# one validates everything the branch changes (changes.sh decides on the
# whole branch, not on the push), so nothing the older one would have
# checked goes unchecked, a push of documentation on top included.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `bash -eo pipefail` for every `run:` (GitHub's default for a step with no
# `shell:` is `bash -e`, without pipefail).
defaults:
  run:
    shell: bash

jobs:
  # A branch that changes only documentation since it left staging
  # (changes.sh, the docs-only.sh rule) runs the secret scan and `Docs`;
  # anything else, the whole validation, on every push. The audit's base is
  # where the branch left staging too: what the branch changes.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.changes.outputs.docs }}
      audit_base: ${{ steps.changes.outputs.audit_base }}

    steps:
      # The history the comparison reads (commits and trees) and the
      # scripts; origin/staging comes with it.
      - name: Check out the full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          sparse-checkout: .github/scripts

      - name: Classify changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/changes.sh branch

  # Secrets in the history (INFRA-21). Every commit, not only the diff: a key
  # that reached any branch is already out. The CLI runs from its image,
  # pinned by digest (gitleaks-action needs a paid license on organization
  # repositories). What the history already had when this was switched on is
  # in .gitleaksignore, by fingerprint; a new finding fails the job, and
  # `--redact` keeps the secret itself out of the log. The same command in
  # every workflow that scans.
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    # Measured under 30 s.
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan the history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            -c "git config --global --add safe.directory /repo && gitleaks git /repo --redact --no-banner --exit-code 1"

  validate:
    name: Validate
    needs: changes
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      packages: read
    with:
      docs: ${{ needs.changes.outputs.docs == 'true' }}
      e2e: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e == true }}
      audit_base: ${{ needs.changes.outputs.audit_base }}
      ai_local: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      CLIENT_REPOS_READ_TOKEN: ${{ secrets.CLIENT_REPOS_READ_TOKEN }}
