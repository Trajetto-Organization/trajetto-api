name: Build OSRM Images

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-osrm-brazil:
    name: Build OSRM Brazil Complete
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/trajetto-osrm
          tags: |
            type=raw,value=brazil
            type=raw,value=latest
            type=raw,value=brazil-{{date 'YYYYMMDD'}}
            type=sha,prefix=brazil-

      - name: Build and push OSRM Brazil
        uses: docker/build-push-action@v5
        with:
          context: ./osrm
          file: ./osrm/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
