name: Test, Build and Deploy Backend

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Creates the run button

env:
  # Common environment variables for all jobs
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  RABBITMQ_URL: amqp://guest:guest@localhost:5672
  REDIS_URL: redis://localhost:6379
  HTTP_REQUEST: http://localhost:3000
  API_HTTP_REQUEST: http://localhost:3333
  JWT_SECRET: test-jwt-secret-key-for-github-actions-only
  JWT_SECRET_REFRESH_TOKEN: test-jwt-refresh-secret-key-for-github-actions-only
  EVOLUTION_API_URL: http://localhost:8080/test
  EVOLUTION_API_KEY: test-evolution-api-key
  EVOLUTION_HTTP_REQUEST: http://localhost:3333
  TRAJETTO_WHATSAPP_BUSINESS_PHONE: 5524999999999
  TRAJETTO_WHATSAPP_INSTANCE_NAME: Trajetto-Business-Test
  UPLOAD_STORAGE_TYPE: local
  UPLOAD_LOCAL_PATH: ./tmp
  MASTER_USER_EMAIL: test-master@example.com
  MASTER_USER_INITIAL_PASSWORD: test-master-password-ci-only

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 30s
          --health-timeout 30s
          --health-retries 5
        ports:
          - 5672:5672
          - 15672:15672

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Alinhado com a base do Dockerfile (node:22.21.1-alpine) e com o
          # ambiente local. O Node 20 saiu do suporte em abril/2026 e nao
          # atende o engine de parte da cadeia (semantic-release exige
          # ^22.14.0 || >=24.10.0).
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Primeiro passo de verificacao: e o mais barato de todos. Nao faz sentido
      # gastar minutos em tsc e vitest se o codigo nem esta formatado.
      - name: Lint
        run: yarn lint:check

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Type-check
        run: yarn typecheck

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done'
          timeout 60 bash -c 'until nc -z localhost 5672; do sleep 1; done'
          timeout 60 bash -c 'until nc -z localhost 6379; do sleep 1; done'

      - name: Create tmp directory
        run: mkdir -p src/tmp

      - name: Run unit tests
        run: yarn test --run --reporter=basic

      - name: Run E2E tests
        run: yarn test:e2e --run --reporter=basic

  release:
    name: Release (semantic-release)
    runs-on: ubuntu-latest
    # Depende do build TAMBEM, nao so do test. Antes os dois corriam em
    # paralelo depois do test, entao um build-and-push que falhasse nao
    # impedia o release: a tag, o CHANGELOG e a GitHub Release saiam anunciando
    # uma versao cuja imagem nunca chegou no registry. O release e o ultimo
    # passo justamente por ser o unico irreversivel.
    needs: [test, build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write # criar a tag, a release e commitar o CHANGELOG
      issues: write # comentar nas issues fechadas pela versao
      pull-requests: write # comentar nos PRs incluidos na versao

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # semantic-release precisa do historico completo: ele descobre a
          # ultima tag e analisa os commits desde entao para decidir se a versao
          # sobe em patch, minor ou major. Com o clone raso padrao nao ha o que
          # analisar e nenhuma release e criada.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: test
    # Só no push: o dispatch é o botão de PROMOVER para producao, e deve apenas
    # acionar o Portainer para repuxar a imagem que ja foi construida e validada
    # neste push. Rebuildar no dispatch desperdicaria minutos e, pior, poderia
    # publicar uma imagem diferente da que passou pelo portao de qualidade caso
    # a main tenha andado nesse meio tempo.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trajetto-organization/trajetto-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

  deploy:
    runs-on: ubuntu-latest

    # Sem `needs`: o deploy nao depende de nenhum job deste run. A imagem ja
    # esta no ghcr desde o push; aqui so avisamos o Portainer para repuxar.
    if: github.event_name == 'workflow_dispatch'

    # The line below enables manual approval on GitHub.
    environment: Production
    steps:
      - name: Deploy to Portainer via Webhook
        run: |
          curl --fail-with-body --retry 3 --proto '=https' --tlsv1.2 -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
