name: Test, Build and Deploy Backend

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Common environment variables for all jobs
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  RABBITMQ_URL: amqp://guest:guest@localhost:5672
  HTTP_REQUEST: http://localhost:3000
  API_HTTP_REQUEST: http://localhost:3333
  JWT_SECRET: test-jwt-secret-key-for-github-actions-only
  JWT_SECRET_REFRESH_TOKEN: test-jwt-refresh-secret-key-for-github-actions-only
  EVOLUTION_API_URL: http://localhost:8080/test
  EVOLUTION_API_KEY: test-evolution-api-key
  EVOLUTION_HTTP_REQUEST: http://localhost:3333
  TRAJETTO_WHATSAPP_BUSINESS_PHONE: 5524999999999
  TRAJETTO_WHATSAPP_INSTANCE_NAME: Trajetto-Business-Test
  UPLOAD_STORAGE_TYPE: local
  UPLOAD_LOCAL_PATH: ./tmp
  MASTER_USER_EMAIL: test-master@example.com
  MASTER_USER_INITIAL_PASSWORD: test-master-password-ci-only

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 30s
          --health-timeout 30s
          --health-retries 5
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done'
          timeout 60 bash -c 'until nc -z localhost 5672; do sleep 1; done'

      - name: Create tmp directory
        run: mkdir -p src/tmp

      - name: Run unit tests
        run: yarn test --run --reporter=basic

      - name: Setup E2E test environment
        run: yarn prisma:generate

      - name: Run E2E tests
        run: yarn test:e2e --run --reporter=basic

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trajetto-organization/trajetto-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}
