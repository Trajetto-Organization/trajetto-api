name: Pipeline (staging → produção)

# The whole road from a commit to production, in one file (docs/deploy.md):
#
#   push to staging ─▶ validation (audit, lint, typecheck, unit + coverage
#                      floor, E2E against Postgres/Redis, AI pytest, gitleaks)
#                  ─▶ build the images ONCE ─▶ GHCR `sha-<sha>` (immutable);
#                     the release image (migrations) and the AI image are
#                     reused, not rebuilt, when their source is the same as
#                     in an image already built
#                  ─▶ the migrations, only when staging's database has not
#                     applied that release image yet (Dokploy Application
#                     trajetto-api-migrate), and only then the services
#                  ─▶ per service, its `staging` tag moved by digest and then
#                     Dokploy (staging Applications): the AI only if its
#                     digest changed, then the API
#                  ─▶ wait until the public API answers this commit
#                  ─▶ `staged-<sha>`: the marker the PR and the promote require
#
#   pull request into main ─▶ the same validation, plus: staging deployed
#                             the PR head (`staged-<sha>` exists), or the
#                             head only changes documentation since a commit
#                             staging deployed (.github/scripts/staged-build.sh)
#
#   merge into main ─▶ PROMOTE: the exact digests staging validated, never a
#                      rebuild ─▶ migrations (when needed) ─▶ `stable` ─▶ Dokploy
#                      (production Applications) ─▶ wait until Swarm runs them
#                      ─▶ release (tag, CHANGELOG, GitHub Release)
#
# A red run here means the code (or a dependency it just changed) is wrong,
# never the network: every registry query tells "not found" from "did not
# answer" and retries the second (.github/scripts/ghcr.sh), the dependency
# audit blocks only a change to the dependencies (audit-gate.sh), the image
# scan's database download is cached, every image the jobs pull is pinned by
# digest and every job has a timeout (docs/deploy.md, "Um vermelho é sempre
# do código").
#
#   Run workflow on main ─▶ the same promote with an older immutable tag:
#                           the rollback button.
#   Run workflow on staging ─▶ the staging road again for the branch head
#                              (force_ai_build: rebuild and redeploy the AI).
#
# One image per service for both environments: the API reads all of its
# configuration at runtime, so staging and production differ only in the
# Environment of their Dokploy app.
on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [main]
  # On MAIN, the ROLLBACK button (or a manual re-promote): dispatch it with
  # the immutable tag of the build to ship. `image_tag` has no default on
  # purpose — a moving default (`latest` used to be one) ships whatever was
  # built last, not the build someone chose — and an empty one is refused by
  # the promote's validation step. It is not `required` only because the
  # same form serves staging:
  #
  # On STAGING, the staging road again for the branch head (validation,
  # build, deploy). `force_ai_build` rebuilds and redeploys the AI even when
  # nothing under infra/ai-ocr changed — the AI is otherwise reused by its
  # source and redeployed only when its digest changes (build-and-push,
  # deploy-staging, promote-production): a fix that reached the base image
  # without a digest bump, or an AI that drifted from its tag, needs this.
  # On main it only redeploys production's AI (nothing is ever built there).
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Na main (rollback): tag imutável do build a publicar em produção, sha-<sha> (builds antigos: main-<sha>). Na staging: deixe vazio"
        required: false
      force_ai_build:
        description: "Reimplanta a trajetto-ai mesmo sem mudança (na staging também a reconstrói, mesmo sem mudança em infra/ai-ocr)"
        type: boolean
        required: false

# Least privilege by default; the jobs that push to GHCR or write releases
# ask for more themselves.
permissions:
  contents: read

# A pull request's newer push cancels its older validation. Pushes never
# cancel each other here: each push run has its own group, and the jobs that
# deploy carry their own concurrency (one at a time, never cut midway).
concurrency:
  group: pipeline-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `bash -eo pipefail` for every `run:` (GitHub's default for a step with no
# `shell:` is `bash -e`, without pipefail): a failure inside a pipe — `git
# ls-remote | cut` — fails the step instead of handing an empty value on.
defaults:
  run:
    shell: bash

env:
  # Common environment variables for the validation jobs
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  REDIS_URL: redis://localhost:6379
  HTTP_REQUEST: http://localhost:3000
  API_HTTP_REQUEST: http://localhost:3333
  JWT_SECRET: test-jwt-secret-key-for-github-actions-only
  JWT_SECRET_REFRESH_TOKEN: test-jwt-refresh-secret-key-for-github-actions-only
  META_WHATSAPP_TEMPLATE_NAME: trajetto_notification
  META_WHATSAPP_API_VERSION: v23.0
  UPLOAD_STORAGE_TYPE: local
  UPLOAD_LOCAL_PATH: ./tmp
  MASTER_USER_EMAIL: test-master@example.com
  MASTER_USER_INITIAL_PASSWORD: test-master-password-ci-only

jobs:
  # ── Validation: every push to staging and every pull request into main ──

  test:
    name: Lint, type-check, unit (coverage floor) and E2E
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/staging'
    # Measured: 25-27 min on a 4-vCPU runner (public repository), 32-47 min
    # on the 2-vCPU one (private), most of it the E2E (its second phase runs
    # the replica files one at a time). Twice the worst, so a hung step stops
    # here instead of at GitHub's 6 h.
    timeout-minutes: 90

    # By digest, the same in the three repositories (the smoke test below
    # and trajetto-ui/trajetto-mobile): a tag moves with no commit of ours.
    # Dependabot does not read workflow files; bump by hand, all at once
    # (docs/deploy.md, "Versões fixas").
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab # postgres:16-alpine (16.15)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f # redis:7-alpine (7.4.12)
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      # Full history: tests/unitaires/contract/retired-routes.test.ts compares
      # the routes against origin/main at the fork point — exactly the
      # question before production: does this build drop a route the
      # production build still serves? A shallow clone skips that test. The
      # dependency audit compares with the base of the push or PR too.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The exact version of the Dockerfile base (node:22.21.1-alpine), in
          # every job of every workflow: "22" floated with the runner's
          # toolcache, so the same commit could test on one Node and ship on
          # another (tests/unitaires/lifecycle/ci-stability.test.ts holds them
          # together; a Dependabot bump of the base moves these by hand).
          node-version: "22.21.1"
          cache: "yarn"

      # The Prisma CLI's schema engine (`prisma migrate deploy`, which the E2E
      # environment runs) is downloaded by @prisma/engines' postinstall from
      # binaries.prisma.sh into ~/.cache/prisma, then copied to node_modules.
      # The postinstall fails SILENTLY (failSilent): a download that dies
      # leaves no engine and resurfaces later as a migrate that downloads on
      # demand. Cached by the engines' version (the commit hash in yarn.lock),
      # so a cache hit installs offline.
      - name: Prisma engines version
        id: prisma-engines
        run: |
          version=$(awk '/^"?@prisma\/engines-version@/ { getline; gsub(/[" \r]/, "", $2); print $2; exit }' yarn.lock)
          if [ -z "$version" ]; then
            echo "::error::Não achei a versão de @prisma/engines-version no yarn.lock."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache the Prisma engines
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/prisma
          key: prisma-engines-${{ runner.os }}-${{ steps.prisma-engines.outputs.version }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Checked here, with its cause, instead of a migrate failing later.
      # The download already retries inside Prisma; this runs it again only
      # when the postinstall left nothing behind.
      - name: Make sure the Prisma schema engine is installed
        run: |
          engine() { compgen -G 'node_modules/@prisma/engines/schema-engine-*' > /dev/null; }
          for attempt in 1 2 3; do
            engine && exit 0
            echo "::warning::O schema engine do Prisma não ficou em node_modules/@prisma/engines (download do postinstall; tentativa ${attempt} de 3). Baixando de novo."
            sleep $((attempt * 10))
            node node_modules/@prisma/engines/scripts/postinstall.js
          done
          engine && exit 0
          echo "::error::O schema engine do Prisma não foi baixado de binaries.prisma.sh depois de 3 tentativas: o E2E não migra sem ele. É o download, não o código."
          exit 1

      # A CRITICAL advisory in a production dependency stops the pipeline
      # before an image exists (INFRA-16) — when this push or PR changes the
      # dependencies (or audit-ci.jsonc). Otherwise the audit still runs and
      # reports, without blocking: the advisory database changes daily with
      # no commit of ours, and Dependabot is the watch (audit-gate.sh). The
      # reasoned, dated exceptions live in audit-ci.jsonc.
      - name: Audit production dependencies
        env:
          AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/audit-gate.sh

      # First check of all, because it is the cheapest one. There is no point
      # spending minutes on tsc and the test suite if the code is not even
      # formatted.
      - name: Lint
        run: yarn lint:check

      - name: Generate Prisma client
        run: yarn prisma:generate

      # tsc holds about 2.3 GB live for this project, and Node's default
      # heap on a 7-8 GB runner (a private repository's) is about 2 GB: the
      # check died there with "JavaScript heap out of memory", measured in a
      # 7 GB Linux container on 30/10/2026. A fixed 4 GB no longer depends on
      # the runner's size.
      - name: Type-check
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn typecheck

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done'
          timeout 60 bash -c 'until nc -z localhost 6379; do sleep 1; done'

      # tests/E2E/health-metrics.test.ts needs the test Postgres OFF the
      # default max_connections (100): a panel hard-coding 100 would pass
      # against a default server. A service container takes no command (no
      # `-c max_connections=...`), so the setting goes in with ALTER SYSTEM
      # and a restart of that container. 200 also leaves headroom for the
      # E2E files running in parallel, each with its own pool.
      - name: Take the test Postgres off the default max_connections
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -c "ALTER SYSTEM SET max_connections = 200"
          docker restart "$POSTGRES_CONTAINER"
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done'
          configured="$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -tAc "SHOW max_connections")"
          echo "max_connections=$configured"
          test "$configured" = 200

      - name: Create tmp directory
        run: mkdir -p src/tmp

      # The same floor as the branch CI (package.json `test:coverage`;
      # docs/testes.md "Cobertura"): a build under it never becomes an image.
      - name: Run unit tests (with coverage floor)
        run: yarn test:coverage --reporter=basic --coverage.reporter=text-summary --coverage.reporter=json-summary --coverage.reporter=html

      - name: Publish the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          retention-days: 14

      # One database per test file, created and dropped by the Prisma test
      # environment on the service container above. `yarn test:e2e` runs the
      # two phases of infra/scripts/run-e2e.mjs: the shared files in
      # parallel, then the files that start replicas one at a time. The
      # Windows batching rule (docs/testes.md) does not apply here.
      - name: Run E2E tests
        run: yarn test:e2e --run --reporter=basic

  # The trajetto-ai service (infra/ai-ocr, ADR 0010): its pytest suite runs
  # INSIDE the image it ships in — the `test` stage builds the same base
  # (hashed wheels, the models versioned in infra/ai-ocr/models and checked
  # by SHA-256, offline) and runs as the runtime user.
  #
  # Through Buildx with the GitHub cache (scope `ai-test`, which
  # build-and-push reads too): a source that already passed finds every
  # layer, the pytest one included, and takes seconds. The build reaches
  # only Docker Hub (the pinned base) and PyPI (hashed wheels); the PP-OCRv5
  # weights used to come from a host in China on every uncached build.
  ai-ocr:
    name: AI OCR service (image + pytest)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/staging'
    # Measured ~1.2 min; a build with no cache downloads the wheels again.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # BuildKit pinned by digest (the action's default is the moving
      # `buildx-stable-1` tag of Docker Hub). Bumped by hand, like the
      # services' digests.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      # No output: the result stays in the builder, and the cache export is
      # an optimisation that never fails the job (ignore-error).
      - name: Build the image and run its tests
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./infra/ai-ocr
          target: test
          push: false
          cache-from: type=gha,scope=ai-test
          cache-to: type=gha,mode=max,scope=ai-test,ignore-error=true

  # Secrets in the history (INFRA-21), with the same pinned image, flags,
  # .gitleaksignore and .gitleaks.toml as ci.yml. No image is built before
  # it passes. The baseline is by commit SHA, so it holds as long as PRs land
  # with a merge commit (which the promote needs anyway): a squash merge
  # rewrites those SHAs.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/staging'
    # Measured under 30 s.
    timeout-minutes: 10

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan every commit for secrets
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            -c "git config --global --add safe.directory /repo && gitleaks git /repo --redact --no-banner --exit-code 1"

  # ── Staging: build once, then deploy what was built ──

  build-and-push:
    name: Build and push the images (once)
    runs-on: ubuntu-24.04
    needs: [test, ai-ocr, secrets]
    # Staging only (a push, or Run workflow on staging). A pull request
    # validates, and the merge into main promotes the digests built HERE:
    # rebuilding later could publish bytes different from the ones staging
    # ran.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging'
    # Measured 2-9 min; a build with every cache gone, both smoke tests and
    # the scan fit well inside this.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    # The digests this commit ships: staging is moved to exactly these bytes,
    # and its database migrated by exactly this release image. The release
    # image and the AI's are the images built here, or the ones reused for
    # the same source.
    outputs:
      api_digest: ${{ steps.build.outputs.digest }}
      migrate_digest: ${{ steps.build-migrate.outputs.digest || steps.migrate-source.outputs.digest }}
      ai_digest: ${{ steps.build-ai.outputs.digest || steps.ai-source.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The same pinned BuildKit as the ai-ocr job.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the immutable `sha-<short sha>`. The mutable tags are pointers
      # the deploy jobs move by digest: `staging` (every push to staging) and
      # `stable` (the promote). The promote finds this build again by the
      # commit it came from.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/trajetto-organization/trajetto-api
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-

      # The release image (Dockerfile, stage `migrate`): the API image plus
      # the Prisma CLI, the migrations and the seeds. The deploys run it on
      # the Dokploy Application trajetto-api-migrate before the API rolls
      # out (deploy-staging, promote-production).
      #
      # Rebuilt only when what it runs changed, as the AI. Every file the
      # release step runs or reads is listed in
      # .github/scripts/migrate-source.sh, which hashes them into one key:
      # the migrations and the schema, the seeds and the code they import,
      # the entrypoint, the Dockerfile, the dependencies. Every build is also
      # tagged `src-<key>`; a push that finds the tag reuses that image —
      # same bytes, same digest — and only adds this commit's `sha-<sha>`.
      # The deploys run the step only when that digest is not the one their
      # database last applied, so a push that touches none of those files
      # neither rebuilds the image nor runs the step again.
      #
      # "No such tag" builds; GHCR not answering fails the step after its
      # retries (ghcr.sh).
      - name: Is there a release image for this source already?
        id: migrate-source
        run: |
          key=$(bash .github/scripts/migrate-source.sh)
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          digest=$(bash .github/scripts/ghcr.sh digest "ghcr.io/trajetto-organization/trajetto-api-migrate:src-${key}")
          if [ -n "$digest" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "trajetto-api-migrate: migrations, seeds e o que eles rodam iguais aos de src-${key::12}; imagem reaproveitada (${digest}), sem rebuild." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (release image)
        id: meta-migrate
        if: steps.migrate-source.outputs.build == 'true'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/trajetto-organization/trajetto-api-migrate
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
            type=raw,value=src-${{ steps.migrate-source.outputs.key }}

      # The API image runs BEFORE it is pushed (§14/§19: smoke test of the
      # final image; the `test` job runs the source, never the image).
      # Built into the runner's Docker only — no push, no attestations (the
      # classic image store cannot load them) — and the push step below gets
      # the same build back from this builder's cache: same context, file
      # and build args, every layer CACHED.
      - name: Build the API image for the smoke test
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: false
          load: true
          tags: trajetto-api:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            GIT_SHA=${{ github.sha }}

      # On top of the API image just built: every layer up to the runner is
      # CACHED, only the release image's own layers are new.
      - name: Build the release image for the smoke test
        if: steps.migrate-source.outputs.build == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          target: migrate
          push: false
          load: true
          tags: trajetto-api-migrate:smoke
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha
          build-args: |
            GIT_SHA=${{ github.sha }}

      # A reused release image is the one the deploys will run, so it is the
      # one the smoke test runs: pulled by digest, under the same local name.
      # A pull that fails is tried again; persistent, it fails as GHCR's.
      - name: Pull the reused release image for the smoke test
        if: steps.migrate-source.outputs.build == 'false'
        env:
          DIGEST: ${{ steps.migrate-source.outputs.digest }}
        run: |
          image="ghcr.io/trajetto-organization/trajetto-api-migrate@${DIGEST}"
          for attempt in 1 2 3; do
            if docker pull --quiet "$image" > /dev/null; then
              docker tag "$image" trajetto-api-migrate:smoke
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Falha ao baixar ${image} do GHCR (tentativa ${attempt} de 3). De novo em $((attempt * 20))s."
              sleep $((attempt * 20))
            fi
          done
          echo "::error::Não deu para baixar ${image} do GHCR depois de 3 tentativas. Não é um problema do código."
          exit 1

      # Liveness touches no dependency, but the process never gets there
      # without Postgres: docker-entrypoint.sh waits for it and checks the
      # schema before the server starts. So both images run against a
      # throwaway Postgres and Redis on an internal network — no route out,
      # so the Prisma CLI must find its engines in the image instead of
      # downloading them — in the order a deploy runs them:
      # - the API image carries no Prisma CLI, migrations or seeds, and
      #   names the migration it was built for (build/schema-version.json);
      # - on the empty database it REFUSES to start (the schema guard): a
      #   replica never serves on a schema older than its build;
      # - the release image, as the Dokploy Application runs it (its default
      #   command, `release`) and with only the Environment that
      #   Application has (the database URL; on an empty database also the
      #   bootstrap flag and the master user): every migration, then the
      #   seeds, strictly (Prisma queries, bcrypt, ExcelJS reading the
      #   infraction table), until its own HEALTHCHECK reports the step
      #   done — the signal dokploy-release.mjs waits for;
      # - the API image again, now on the migrated database: it must pass
      #   its own HEALTHCHECK, report this commit on /health/liveness and be
      #   ready (/health/readiness reaches the database).
      # Every value is random or a placeholder, lives only in these
      # containers and goes through an env file, never a command line. A
      # failure stops the job here: nothing reaches GHCR, and staging keeps
      # the build it runs.
      - name: Smoke test the API image
        env:
          IMAGE: trajetto-api:smoke
          MIGRATE_IMAGE: trajetto-api-migrate:smoke
          # The majors production runs, pinned by the same digests as the
          # `test` job's services.
          POSTGRES_IMAGE: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
          REDIS_IMAGE: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        run: |
          net="api-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          envfile="${RUNNER_TEMP}/api-smoke.env"
          releaseenv="${RUNNER_TEMP}/api-smoke-release.env"
          log="${RUNNER_TEMP}/api-smoke-migrate.log"
          pg=""
          redis=""
          guard=""
          release=""
          cid=""
          cleanup() {
            for container in "$cid" "$release" "$guard" "$pg" "$redis"; do
              [ -z "$container" ] || docker rm -f "$container" > /dev/null 2>&1 || true
            done
            docker network rm "$net" > /dev/null 2>&1 || true
            rm -f "$envfile" "$releaseenv" "$log"
          }
          trap cleanup EXIT

          # The logs are a diagnosis: under pipefail a `docker logs` that fails
          # must not end the step before the verdict below.
          fail() {
            echo "::error::Smoke test da imagem trajetto-api: $1. Nada foi publicado no GHCR, e a staging segue com o build que já roda."
            if [ -n "$cid" ]; then docker logs "$cid" 2>&1 | tail -n 100 || true; fi
            exit 1
          }

          # TURNSTILE_SECRET_KEY is Cloudflare's public always-pass test
          # key; R2 is a placeholder the boot never reaches.
          (
            umask 077
            {
              echo "DATABASE_URL=postgresql://postgres@postgres:5432/trajetto?schema=public"
              echo "REDIS_URL=redis://redis:6379"
              echo "ALLOW_EMPTY_DATABASE_BOOTSTRAP=true"
              echo "APP_ENV=staging"
              echo "HTTP_REQUEST=http://localhost:3000"
              echo "JWT_SECRET=$(openssl rand -base64 48)"
              echo "JWT_SECRET_REFRESH_TOKEN=$(openssl rand -base64 48)"
              echo "MASTER_USER_EMAIL=smoke@trajetto.invalid"
              echo "MASTER_USER_INITIAL_PASSWORD=$(openssl rand -hex 24)"
              echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
              echo "RATE_LIMIT_TRUSTED_PROXY=none"
              echo "UPLOAD_STORAGE_TYPE=r2"
              echo "R2_ACCOUNT_ID=smoke"
              echo "R2_BUCKET_NAME=smoke"
              echo "R2_ACCESS_KEY_ID=smoke"
              echo "R2_SECRET_ACCESS_KEY=smoke"
            } > "$envfile"
            # The release Application's Environment, and nothing more
            # (docs/deploy.md, "Migrations"): a seed that needed the API's
            # whole environment again would fail here.
            grep -E '^(DATABASE_URL|ALLOW_EMPTY_DATABASE_BOOTSTRAP|MASTER_USER_EMAIL|MASTER_USER_INITIAL_PASSWORD)=' \
              "$envfile" > "$releaseenv"
          )

          # Before any database: what the API image does NOT carry.
          if ! docker run --rm --entrypoint sh "$IMAGE" -c \
            'test ! -e node_modules/prisma && test ! -e node_modules/@prisma/engines && test ! -e prisma && test ! -e prisma.config.ts && test ! -e build/seed.js && test -f build/schema-version.json'; then
            fail "a imagem da API traz o CLI do Prisma, migrations ou seeds, ou não traz build/schema-version.json"
          fi

          docker network create --internal "$net" > /dev/null
          pg=$(docker run -d --network "$net" --network-alias postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=trajetto "$POSTGRES_IMAGE")
          redis=$(docker run -d --network "$net" --network-alias redis "$REDIS_IMAGE")

          # The entrypoint waits for Postgres itself (wait-for-postgres),
          # then refuses: nothing is migrated yet. A server that started
          # instead never exits, and the wait times out.
          guard=$(docker run -d --network "$net" --env-file "$envfile" "$IMAGE")
          code=$(timeout 180 docker wait "$guard") || code=timeout
          docker logs "$guard" > "$log" 2>&1 || true
          if [ "$code" = "0" ] || [ "$code" = "timeout" ] || ! grep -q "não tem a migration" "$log"; then
            tail -n 100 "$log"
            fail "a API não recusou o banco sem as migrations dela (saída ${code})"
          fi

          # Done = healthy (the marker); a failed step exits, as the task
          # does in Swarm.
          release=$(docker run -d --network "$net" --env-file "$releaseenv" \
            --health-interval 2s "$MIGRATE_IMAGE")
          state=""
          for _ in $(seq 1 90); do
            state=$(docker inspect --format '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}sem-healthcheck{{end}}' "$release")
            [ "$state" = "running/starting" ] || break
            sleep 2
          done
          docker logs "$release" > "$log" 2>&1 || true
          if [ "$state" != "running/healthy" ]; then
            tail -n 100 "$log"
            fail "a etapa de release (a imagem trajetto-api-migrate) não terminou num banco vazio (${state})"
          fi
          docker rm -f "$release" > /dev/null
          release=""

          cid=$(docker run -d --network "$net" --env-file "$envfile" \
            --health-interval 2s --health-start-period 120s "$IMAGE")

          state=""
          for _ in $(seq 1 75); do
            state=$(docker inspect --format '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}sem-healthcheck{{end}}' "$cid")
            [ "$state" = "running/starting" ] || break
            sleep 2
          done
          [ "$state" = "running/healthy" ] || fail "o container não ficou saudável (${state})"

          commit=$(docker exec "$cid" node -e \
            "fetch('http://127.0.0.1:3333/health/liveness').then((r) => r.json()).then((b) => console.log(b.commit))") \
            || fail "/health/liveness não respondeu"
          [ "$commit" = "$GITHUB_SHA" ] || fail "/health/liveness informou o commit '${commit}', não ${GITHUB_SHA}"
          docker exec "$cid" wget -q -O /dev/null http://127.0.0.1:3333/health/readiness \
            || fail "/health/readiness não respondeu 200 (banco)"

          echo "trajetto-api: smoke test OK (a API recusa o banco sem as migrations dela; a imagem de migração, só com o Environment da Application dela, aplica tudo do zero e os seeds e fica saudável; a API sobe saudável e pronta, sem rede externa, commit ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # The cache is an optimisation: a 429 or 5xx of the cache service
          # while exporting must not fail a build that already pushed.
          cache-to: type=gha,mode=max,ignore-error=true
          # Attestations next to the image in GHCR (INFRA-16): what went into
          # it (SBOM) and how it was built (provenance). `max` records the
          # build args too; the only one is the commit, which is no secret.
          sbom: true
          provenance: mode=max
          # The commit, as APP_COMMIT_SHA in the image: GET /health/liveness
          # answers it, and deploy-staging waits until the public API does.
          # Declared after the Dockerfile's last RUN, so no layer depends on it.
          build-args: |
            GIT_SHA=${{ github.sha }}

      # The same build of the release image the smoke test ran, from the
      # cache, with its own attestations. Its cache export is a superset of
      # the API's (every stage up to the runner, plus its own). A reused
      # image skips it.
      - name: Build and push the release image
        id: build-migrate
        if: steps.migrate-source.outputs.build == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          target: migrate
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          sbom: true
          provenance: mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

      # Registry-side, by digest, nothing pulled: this commit's `sha-<sha>`
      # names the reused release image, so the promote finds the release
      # image of every commit by the same name as the API's.
      - name: Tag the reused release image for this commit
        if: steps.migrate-source.outputs.build == 'false'
        env:
          DIGEST: ${{ steps.migrate-source.outputs.digest }}
        run: |
          bash .github/scripts/ghcr.sh tag \
            "ghcr.io/trajetto-organization/trajetto-api-migrate:sha-${GITHUB_SHA::7}" \
            "ghcr.io/trajetto-organization/trajetto-api-migrate@${DIGEST}"

      - name: Image digest
        env:
          API_DIGEST: ${{ steps.build.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.build-migrate.outputs.digest || steps.migrate-source.outputs.digest }}
        run: |
          echo "trajetto-api@${API_DIGEST}"
          echo "trajetto-api-migrate@${MIGRATE_DIGEST}"

      # The OCR service of the AI readings (infra/ai-ocr, ADR 0010), tagged
      # like the API — `sha-<sha>` — and moved with it to staging and stable.
      #
      # Rebuilt only when its source changed. The image's whole build input
      # is infra/ai-ocr (the context: Dockerfile, hashed requirements, the
      # models and their hashes, the code), and git names that directory's content
      # with one hash. Every AI build is also tagged `src-<that hash>`; a
      # push that finds the tag reuses that image — same bytes, same digest —
      # and only adds this commit's `sha-<sha>` to it. A rebuild made a new
      # digest every time (labels, the commit), so every API push used to
      # restart the AI and send it over the VPS's flaky route again. Run
      # workflow on staging with `force_ai_build` rebuilds anyway (a change
      # that reaches the image without touching infra/ai-ocr, like a build
      # option here).
      #
      # "No such tag" builds; GHCR not answering fails the step after its
      # retries (ghcr.sh) — it used to read as "no such tag" and rebuild.
      - name: Is there an AI image for this source already?
        id: ai-source
        env:
          FORCE: ${{ inputs.force_ai_build }}
        run: |
          tree=$(git rev-parse HEAD:infra/ai-ocr)
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          digest=""
          if [ "$FORCE" = "true" ]; then
            echo "::notice::force_ai_build: a imagem trajetto-ai é reconstruída mesmo sem mudança em infra/ai-ocr."
          else
            digest=$(bash .github/scripts/ghcr.sh digest "ghcr.io/trajetto-organization/trajetto-ai:src-${tree}")
          fi
          if [ -n "$digest" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "trajetto-ai: infra/ai-ocr igual ao de src-${tree::12}; imagem reaproveitada (${digest}), sem rebuild." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # Its pytest suite already ran in the `ai-ocr` job (`--target test`);
      # this builds the runtime stage only. Own cache scope.
      - name: Extract metadata (ai)
        id: meta-ai
        if: steps.ai-source.outputs.build == 'true'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/trajetto-organization/trajetto-ai
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
            type=raw,value=src-${{ steps.ai-source.outputs.tree }}

      # The runtime image runs BEFORE it is pushed (§14/§19: smoke test of
      # the final image; the `ai-ocr` job's pytest ran the `test` stage, not
      # this one). Built into the runner's Docker only — no push, no
      # attestations (the classic image store cannot load them) — and the
      # push step below gets the same build back from this builder's cache:
      # same context, target and build args, every layer CACHED. A reused
      # image skips both: it passed this when it was built.
      - name: Build the AI image for the smoke test
        if: steps.ai-source.outputs.build == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./infra/ai-ocr
          target: runtime
          push: false
          load: true
          tags: trajetto-ai:smoke
          labels: ${{ steps.meta-ai.outputs.labels }}
          # Its own scope, plus the ai-ocr job's: the base and models layers
          # its `test` build just cached are this build's too.
          cache-from: |
            type=gha,scope=ai
            type=gha,scope=ai-test
          build-args: |
            GIT_SHA=${{ github.sha }}

      # Started the way the hardened deploy runs it (read-only root, tmpfs
      # /tmp) and with no network: the models are in the image and the boot
      # must not fetch anything. The token is random and lives only in this
      # container (the server refuses to start without 32+ characters). It
      # must pass its OWN HEALTHCHECK — /health answers 200 only after both
      # profiles loaded and read warmup.jpg — with Docker's timings
      # shortened, and report this commit. A failure stops the job here: the
      # AI image never reaches GHCR and deploy-staging does not run, so
      # staging keeps the build it runs. (The API image above is already in
      # GHCR as `sha-<sha>` by then, but never gets its `staged-<sha>`.)
      - name: Smoke test the AI image
        if: steps.ai-source.outputs.build == 'true'
        env:
          IMAGE: trajetto-ai:smoke
        run: |
          AI_TOKEN=$(openssl rand -hex 32)
          export AI_TOKEN
          cid=$(docker run -d --network none --read-only --tmpfs /tmp \
            --health-interval 2s --health-start-period 120s \
            -e AI_TOKEN "$IMAGE")
          trap 'docker rm -f "$cid" > /dev/null 2>&1 || true' EXIT

          # The logs are a diagnosis, as in the API's smoke test.
          fail() {
            echo "::error::Smoke test da imagem trajetto-ai: $1. A imagem da IA não foi publicada no GHCR, e a staging segue com o build que já roda."
            docker logs "$cid" 2>&1 | tail -n 100 || true
            exit 1
          }

          state=""
          for _ in $(seq 1 75); do
            state=$(docker inspect --format '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}sem-healthcheck{{end}}' "$cid")
            [ "$state" = "running/starting" ] || break
            sleep 2
          done
          [ "$state" = "running/healthy" ] || fail "o container não ficou saudável (${state})"

          commit=$(docker exec "$cid" python -c \
            "import json, urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3))['commit'])") \
            || fail "/health não respondeu"
          [ "$commit" = "$GITHUB_SHA" ] || fail "/health informou o commit '${commit}', não ${GITHUB_SHA}"

          echo "trajetto-ai: smoke test OK (healthy sem rede, commit ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push the AI image
        id: build-ai
        if: steps.ai-source.outputs.build == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./infra/ai-ocr
          target: runtime
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          cache-from: |
            type=gha,scope=ai
            type=gha,scope=ai-test
          cache-to: type=gha,mode=max,scope=ai,ignore-error=true
          sbom: true
          provenance: mode=max
          # GET /health reports it (Dockerfile: declared in the last stage,
          # after every layer).
          build-args: |
            GIT_SHA=${{ github.sha }}

      # Registry-side, by digest, nothing pulled: this commit's `sha-<sha>`
      # names the reused image, so the PR check and the promote find the AI
      # build of every commit by the same name as the API's.
      - name: Tag the reused AI image for this commit
        if: steps.ai-source.outputs.build == 'false'
        env:
          DIGEST: ${{ steps.ai-source.outputs.digest }}
        run: |
          bash .github/scripts/ghcr.sh tag \
            "ghcr.io/trajetto-organization/trajetto-ai:sha-${GITHUB_SHA::7}" \
            "ghcr.io/trajetto-organization/trajetto-ai@${DIGEST}"

      # The images just pushed, by digest: CRITICAL vulnerabilities that
      # already have a fix (INFRA-16). Trivy runs from its image pinned by
      # digest, with the job's token for GHCR.
      #
      # Report-only until the repository variable IMAGE_SCAN_ENFORCE is
      # `true`: the node:22.21.1-alpine base itself carried fixable criticals
      # (OpenSSL, npm's bundled tar) when this was added, and an enforcing
      # scan would have stopped every build. Enforced, a finding fails this
      # job — and with it the staging deploy, so the build never reaches
      # production either.
      #
      # Only a FINDING can fail it, and only when enforced. Trivy's
      # vulnerability database comes from a rate-limited registry
      # (mirror.gcr.io, then ghcr.io), and every `docker run` downloaded it
      # again, twice per run, hidden behind continue-on-error together with
      # the findings. Now it is downloaded once, into a directory the Actions
      # cache keeps per day; the scans read it with --skip-db-update. A failed
      # download falls back to the cached copy, and the summary tells a
      # failed download, a Trivy error and a finding apart.
      - name: Date of the vulnerability database
        id: trivy-db-day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache the vulnerability database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/trivy/db
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-db-day.outputs.day }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # As the runner's user (and a HOME it can write), so the files it
      # leaves are the runner's and the cache can save them.
      - name: Download the vulnerability database
        id: trivy-db
        env:
          TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          cache="$HOME/.cache/trivy"
          mkdir -p "$cache"
          for attempt in 1 2 3; do
            if docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$cache:/trivy-cache" "$TRIVY_IMAGE" \
              image --download-db-only --cache-dir /trivy-cache --no-progress; then
              echo "db=fresh" >> "$GITHUB_OUTPUT"
              echo "Trivy: banco de vulnerabilidades atualizado." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Trivy: falha no download do banco de vulnerabilidades (tentativa ${attempt} de 3). De novo em $((attempt * 20))s."
              sleep $((attempt * 20))
            fi
          done
          if [ -f "$cache/db/trivy.db" ]; then
            day=$(date -u -r "$cache/db/trivy.db" +%Y-%m-%d)
            echo "db=cached" >> "$GITHUB_OUTPUT"
            echo "::warning::Trivy: falha no download do banco de vulnerabilidades depois de 3 tentativas; o scan usa a cópia do cache, de ${day}. Não é achado."
            echo "Trivy: **falha no download do banco**; o scan usou a cópia do cache, de ${day}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "db=missing" >> "$GITHUB_OUTPUT"
            echo "::warning::Trivy: falha no download do banco de vulnerabilidades depois de 3 tentativas, sem cópia no cache: as imagens deste run NÃO foram varridas. Não é achado; o próximo run varre de novo."
            echo "Trivy: **falha no download do banco, sem cópia no cache: o scan não rodou** (não é achado)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Scan the images for fixable critical vulnerabilities
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          API_IMAGE: ghcr.io/trajetto-organization/trajetto-api@${{ steps.build.outputs.digest }}
          MIGRATE_IMAGE: ghcr.io/trajetto-organization/trajetto-api-migrate@${{ steps.build-migrate.outputs.digest || steps.migrate-source.outputs.digest }}
          # Reused or built (the release image and the AI's): what this
          # commit ships is what gets scanned, so a reused image meets
          # today's vulnerability database too.
          AI_IMAGE: ghcr.io/trajetto-organization/trajetto-ai@${{ steps.build-ai.outputs.digest || steps.ai-source.outputs.digest }}
          ENFORCE: ${{ vars.IMAGE_SCAN_ENFORCE == 'true' }}
          DB: ${{ steps.trivy-db.outputs.db }}
        run: |
          if [ "$DB" = "missing" ]; then
            echo "::warning::Trivy: o scan não rodou (sem banco de vulnerabilidades; ver o passo anterior). Não é achado."
            exit 0
          fi
          if [ "$ENFORCE" = "true" ]; then
            mode="reprova (IMAGE_SCAN_ENFORCE=true)"
          else
            mode="só relata"
          fi
          cache="$HOME/.cache/trivy"
          found=""
          for image in "$API_IMAGE" "$MIGRATE_IMAGE" "$AI_IMAGE"; do
            name="${image%@*}"
            name="${name##*/}"
            status=error
            code=0
            # Exit code 3 is a finding; any other non-zero is Trivy failing
            # (an image it could not pull), retried, and never a finding.
            for attempt in 1 2 3; do
              code=0
              docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
                -e TRIVY_USERNAME -e TRIVY_PASSWORD \
                -v "$cache:/trivy-cache" "$TRIVY_IMAGE" \
                image --cache-dir /trivy-cache --skip-db-update --no-progress \
                --scanners vuln --severity CRITICAL --ignore-unfixed \
                --exit-code 3 "$image" || code=$?
              if [ "$code" -eq 0 ]; then
                status=clean
                break
              fi
              if [ "$code" -eq 3 ]; then
                status=findings
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::Trivy: erro ao varrer ${name} (código ${code}; tentativa ${attempt} de 3). De novo em $((attempt * 20))s."
                sleep $((attempt * 20))
              fi
            done
            case "$status" in
              clean)
                echo "Trivy: ${name} sem CRITICAL corrigível." >> "$GITHUB_STEP_SUMMARY"
                ;;
              findings)
                found="${found} ${name}"
                echo "Trivy: **${name} tem CRITICAL corrigível** (a tabela está no log deste passo; ${mode})." >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "::warning::Trivy: não conseguiu varrer ${name} depois de 3 tentativas (último código ${code}): erro do Trivy ou do GHCR, não é achado."
                echo "Trivy: **erro ao varrer ${name}** (não é achado)." >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          done
          if [ -n "$found" ]; then
            if [ "$ENFORCE" = "true" ]; then
              echo "::error::Trivy: CRITICAL corrigível em${found} (IMAGE_SCAN_ENFORCE=true). Atualize a dependência ou a base da imagem; a tabela está acima."
              exit 1
            fi
            echo "::warning::Trivy: CRITICAL corrigível em${found}. Só relata enquanto IMAGE_SCAN_ENFORCE não for true."
          fi

      - name: Summary
        env:
          API_DIGEST: ${{ steps.build.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.build-migrate.outputs.digest || steps.migrate-source.outputs.digest }}
          AI_DIGEST: ${{ steps.build-ai.outputs.digest || steps.ai-source.outputs.digest }}
        run: |
          {
            echo "Imagens deste commit (sha-${GITHUB_SHA::7}): trajetto-api, trajetto-api-migrate e trajetto-ai (as duas últimas construídas ou reaproveitadas)."
            echo "trajetto-api@${API_DIGEST}"
            echo "trajetto-api-migrate@${MIGRATE_DIGEST}"
            echo "trajetto-ai@${AI_DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Staging redeploys on its own, with no approval: that is the whole point of
  # having it. Every push to staging lands here, and the environment is
  # cheap to break.
  #
  # First the database, when it needs it: if staging has not applied this
  # commit's release image yet, the Dokploy Application trajetto-api-migrate
  # runs it (migrations and seeds) and the run waits for the outcome. A
  # failing migration stops the run there, before any tag of the API or the
  # AI moves. Then, per service, in the order the API needs (it calls the
  # AI): move the service's `staging` tag to the digest this run built, then
  # ask Dokploy to redeploy its Application, which pulls `:staging` again.
  # The AI is
  # redeployed only when its digest differs from the one `staging` had (an
  # image reused by its source is already running: a redeploy would only
  # restart it). Then the job waits until the public API answers this
  # commit, and writes `staged-<sha>`, the marker the PR check and the
  # promote require.
  #
  # Each tag moves right before its own deploy, never both up front: a failed
  # AI deploy used to leave the API's `staging` on a build staging never ran.
  # A Dokploy deploy that fails puts its tag back (the last step), so
  # `staging` keeps naming what staging runs — the AI's skip compares
  # against it.
  #
  # Before Dokploy exists the tags still move (so the image staging would run
  # is always visible in GHCR) and the deploy is skipped with a notice. To
  # turn it on: secrets DOKPLOY_URL, DOKPLOY_API_KEY, DOKPLOY_API_APPLICATION_ID
  # and DOKPLOY_MIGRATE_APPLICATION_ID in the `staging` environment
  # (docs/deploy.md, "GitHub" and "Migrations").
  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-24.04
    needs: build-and-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging'

    environment: staging
    # Measured 1-11 min. A deploy whose pulls keep failing tries six times
    # per service (dokploy-deploy.mjs), with pauses up to 160 s, and the
    # liveness check waits up to 10 min: this covers that worst day.
    timeout-minutes: 120

    # One staging deploy at a time: two Dokploy calls on the same app would
    # each follow the other's deployment, and two tag moves could interleave.
    # Never cancelled midway (it would leave the API and AI tags apart).
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the deploy script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts

      # The scripts below run on the same Node as every other job, not on
      # the runner's default, which moves with the runner image.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"

      # Runs finish out of order: an older push whose build was slower would
      # move `staging` BACK after a newer run moved it forward. Only the run
      # of the branch's current head deploys; an older one stops here, green,
      # and leaves staging to the newer run.
      #
      # Except when the newer head only adds documentation on top of this
      # commit (docs-only.sh: `*.md` and docs/, which no image carries): a
      # `[skip ci]` commit runs no pipeline, so nobody else would deploy, and
      # its build would be this one's content. This run deploys and marks its
      # own build, and the PR check and the promote of the newer commit find
      # it (staged-build.sh) — the same rule as trajetto-ui.
      #
      # Only a valid sha decides. A failed or empty read (without pipefail
      # it read as "not the head" and skipped the deploy, green) is tried
      # again, then fails saying GitHub did not answer; so is the fetch of
      # the newer head's history.
      - name: Is this run still the branch head?
        id: head
        run: |
          head=""
          for attempt in 1 2 3; do
            if head=$(git ls-remote origin "$GITHUB_REF" | cut -f1) && [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Não deu para ler a cabeça de ${GITHUB_REF} no GitHub depois de 3 tentativas (resposta: '${head}'). Nada foi movido nem implantado; não é um problema do código."
              exit 1
            fi
            echo "::warning::A leitura da cabeça de ${GITHUB_REF} falhou (tentativa ${attempt} de 3; resposta: '${head}'). De novo em $((attempt * 10))s."
            sleep $((attempt * 10))
          done
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The newer head and its history down to this commit (blobless, as
          # the checkout: commits and trees are all the comparison reads).
          for attempt in 1 2 3; do
            if git fetch --no-tags --depth=100 origin "$head"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Não deu para buscar ${head} no GitHub depois de 3 tentativas (git fetch). Nada foi movido nem implantado; não é um problema do código."
              exit 1
            fi
            echo "::warning::A busca de ${head} falhou (git fetch, tentativa ${attempt} de 3). De novo em $((attempt * 10))s."
            sleep $((attempt * 10))
          done
          ancestor=0
          git merge-base --is-ancestor "$GITHUB_SHA" "$head" || ancestor=$?
          docs=1
          if [ "$ancestor" -eq 0 ]; then
            docs=0
            bash .github/scripts/docs-only.sh "$GITHUB_SHA" "$head" > /dev/null || docs=$?
          elif [ "$ancestor" -ne 1 ]; then
            echo "::error::git merge-base não comparou ${GITHUB_SHA} com ${head} (código ${ancestor})."
            exit 1
          fi
          case "$docs" in
            0)
              echo "current=true" >> "$GITHUB_OUTPUT"
              echo "::notice::staging já está em ${head}, que só acrescenta documentação a este build: este run faz o deploy e grava staged-${GITHUB_SHA::7}."
              ;;
            1)
              echo "current=false" >> "$GITHUB_OUTPUT"
              echo "::notice::staging já está em ${head}: este run (${GITHUB_SHA}) não mexe em staging; o run do commit mais novo faz o deploy."
              ;;
            *) exit 1 ;;
          esac

      - name: Log in to GitHub Container Registry
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What `staging` names before this run moves anything: the AI's skip
      # compares against it, and a failed deploy puts it back. A tag that
      # does not exist yet is empty; GHCR not answering fails here, before
      # anything moved (it used to read as "no tag", redeploy the AI for
      # nothing and lose the digest to put back).
      - name: Read what staging runs now
        id: current
        if: steps.head.outputs.current == 'true'
        env:
          AI_DIGEST: ${{ needs.build-and-push.outputs.ai_digest }}
          FORCE: ${{ inputs.force_ai_build }}
        run: |
          api=$(bash .github/scripts/ghcr.sh digest ghcr.io/trajetto-organization/trajetto-api:staging)
          ai=$(bash .github/scripts/ghcr.sh digest ghcr.io/trajetto-organization/trajetto-ai:staging)
          echo "api=${api}" >> "$GITHUB_OUTPUT"
          echo "ai=${ai}" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != "true" ] && [ -n "$ai" ] && [ "$ai" = "$AI_DIGEST" ]; then
            echo "ai_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::trajetto-ai: staging já roda ${AI_DIGEST} (infra/ai-ocr sem mudança); a IA não é reimplantada. Para forçar: Run workflow na staging com force_ai_build."
            echo "trajetto-ai: sem mudança (${AI_DIGEST}); deploy da IA pulado." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ai_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # All three secrets: deploy. None: Dokploy does not exist yet — a
      # notice, and the run stays green. Some: a configuration mistake, which
      # fails instead of looking like "not set up yet".
      - name: Is the staging deploy configured?
        id: dokploy
        if: steps.head.outputs.current == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_API_APPLICATION_ID: ${{ secrets.DOKPLOY_API_APPLICATION_ID }}
          DOKPLOY_MIGRATE_APPLICATION_ID: ${{ secrets.DOKPLOY_MIGRATE_APPLICATION_ID }}
        run: |
          missing=""
          [ -n "$DOKPLOY_URL" ] || missing="$missing DOKPLOY_URL"
          [ -n "$DOKPLOY_API_KEY" ] || missing="$missing DOKPLOY_API_KEY"
          [ -n "$DOKPLOY_API_APPLICATION_ID" ] || missing="$missing DOKPLOY_API_APPLICATION_ID"
          [ -n "$DOKPLOY_MIGRATE_APPLICATION_ID" ] || missing="$missing DOKPLOY_MIGRATE_APPLICATION_ID"
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$missing" = " DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_API_APPLICATION_ID DOKPLOY_MIGRATE_APPLICATION_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy de staging pulado: o environment staging ainda não tem DOKPLOY_URL, DOKPLOY_API_KEY, DOKPLOY_API_APPLICATION_ID e DOKPLOY_MIGRATE_APPLICATION_ID (docs/deploy.md). A tag staging já aponta para este build."
            echo "Deploy de staging **pulado**: Dokploy ainda não configurado. A tag \`staging\` já aponta para este build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Configuração parcial do Dokploy no environment staging: faltam${missing} (docs/deploy.md; DOKPLOY_MIGRATE_APPLICATION_ID é o id da Application trajetto-api-migrate, seção Migrations)."
            exit 1
          fi

      # The release step runs only when the database has not applied this
      # release image yet. `trajetto-api-migrate:staging-applied` names the
      # last one that FINISHED here: it moves only after the step succeeded
      # (below), so a failed or interrupted step runs again on the next run.
      # The same digest means the same migrations and seeds already ran — a
      # push that touched none of them (migrate-source.sh) reuses the image,
      # and nothing runs again. GHCR not answering fails here (ghcr.sh),
      # before anything moved.
      - name: Do the migrations need to run?
        id: migrations
        if: steps.head.outputs.current == 'true' && steps.dokploy.outputs.enabled == 'true'
        env:
          MIGRATE_DIGEST: ${{ needs.build-and-push.outputs.migrate_digest }}
        run: |
          applied=$(bash .github/scripts/ghcr.sh digest ghcr.io/trajetto-organization/trajetto-api-migrate:staging-applied)
          if [ -n "$applied" ] && [ "$applied" = "$MIGRATE_DIGEST" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Migrations: o banco de staging já aplicou trajetto-api-migrate@${MIGRATE_DIGEST} (migrations e seeds sem mudança); a etapa de release não roda."
            echo "Migrations: sem mudança; o banco de staging já aplicou ${MIGRATE_DIGEST}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # The release Application runs `:staging`: the tag moves to this
      # build's release image, by digest, right before its deploy.
      - name: Move the release image's staging tag to this build
        if: steps.head.outputs.current == 'true' && steps.migrations.outputs.run == 'true'
        env:
          MIGRATE_DIGEST: ${{ needs.build-and-push.outputs.migrate_digest }}
        run: |
          bash .github/scripts/ghcr.sh tag \
            ghcr.io/trajetto-organization/trajetto-api-migrate:staging \
            "ghcr.io/trajetto-organization/trajetto-api-migrate@${MIGRATE_DIGEST}"
          echo "trajetto-api-migrate:staging → ${MIGRATE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      # The release step, ONCE, before the API or the AI moves: Dokploy
      # redeploys the Application trajetto-api-migrate, and the run waits
      # until Swarm reports the step finished or failed
      # (dokploy-release.mjs). A failing migration fails HERE: no tag of the
      # API or the AI moves, they are not redeployed, and staging keeps the
      # build it runs. The API image cannot migrate (it carries no Prisma
      # CLI) and refuses to boot on a database without its migrations.
      # The database URL lives in the Application's Environment in Dokploy,
      # never in CI. Setup: docs/deploy.md ("Migrations").
      - name: Run the database migrations on staging (Dokploy)
        if: steps.head.outputs.current == 'true' && steps.migrations.outputs.run == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_MIGRATE_APPLICATION_ID }}
          DOKPLOY_APP_LABEL: trajetto-api-migrate
          RELEASE_IMAGE: ghcr.io/trajetto-organization/trajetto-api-migrate:staging
        run: node .github/scripts/dokploy-release.mjs

      # Only now, after the step finished: the next run compares with this.
      - name: Record the migrations as applied on staging
        if: steps.head.outputs.current == 'true' && steps.migrations.outputs.run == 'true'
        env:
          MIGRATE_DIGEST: ${{ needs.build-and-push.outputs.migrate_digest }}
        run: |
          bash .github/scripts/ghcr.sh tag \
            ghcr.io/trajetto-organization/trajetto-api-migrate:staging-applied \
            "ghcr.io/trajetto-organization/trajetto-api-migrate@${MIGRATE_DIGEST}"
          echo "trajetto-api-migrate:staging-applied → ${MIGRATE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      # By digest, never by a tag that could have moved since the build. Only
      # when the AI changed: otherwise `staging` already names this digest.
      - name: Move the AI's staging tag to this build
        id: move-ai
        if: steps.head.outputs.current == 'true' && steps.current.outputs.ai_deploy == 'true'
        env:
          AI_DIGEST: ${{ needs.build-and-push.outputs.ai_digest }}
        run: |
          bash .github/scripts/ghcr.sh tag \
            ghcr.io/trajetto-organization/trajetto-ai:staging \
            "ghcr.io/trajetto-organization/trajetto-ai@${AI_DIGEST}"
          echo "trajetto-ai:staging → ${AI_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      # One Dokploy Application per service, each on its `:staging` tag. The
      # AI goes first (the API calls it), and only when its digest changed.
      # `done` in Dokploy = the Swarm manager ACCEPTED the new spec; the
      # API's rollout is checked after. The AI id is optional: not created
      # yet = a notice. Database backups are Dokploy's own (docs/deploy.md,
      # "Backup e restauração"), not a service this pipeline deploys.
      - name: Deploy the AI service to staging (Dokploy)
        id: deploy-ai
        if: steps.head.outputs.current == 'true' && steps.dokploy.outputs.enabled == 'true' && steps.current.outputs.ai_deploy == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_AI_APPLICATION_ID }}
          DOKPLOY_APP_LABEL: trajetto-ai
          DOKPLOY_OPTIONAL: "true"
        run: node .github/scripts/dokploy-deploy.mjs

      # The API's tag, once the AI it calls is in place.
      - name: Move staging to this build
        id: move-api
        if: steps.head.outputs.current == 'true'
        env:
          API_DIGEST: ${{ needs.build-and-push.outputs.api_digest }}
        run: |
          bash .github/scripts/ghcr.sh tag \
            ghcr.io/trajetto-organization/trajetto-api:staging \
            "ghcr.io/trajetto-organization/trajetto-api@${API_DIGEST}"
          echo "trajetto-api:staging → sha-${GITHUB_SHA::7} (${API_DIGEST})" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to staging (Dokploy)
        id: deploy-api
        if: steps.head.outputs.current == 'true' && steps.dokploy.outputs.enabled == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_API_APPLICATION_ID }}
          DOKPLOY_APP_LABEL: trajetto-api
        run: node .github/scripts/dokploy-deploy.mjs

      # The proof staging runs THIS build, and the default (ROLLOUT_VERIFY
      # unset): the public API's /health/liveness answers the commit its
      # image was built from, and wait-for-version.mjs polls it through the
      # edge until this commit has answered for 90 s — longer than Swarm's
      # rollback monitor, and long enough for an old replica still in the
      # rotation to show up. No SSH key on the host. ROLLOUT_VERIFY=ssh
      # switches to the Swarm-side check below; `off` skips both, logged.
      - name: Wait for the API to serve this build
        id: verify-http
        if: steps.head.outputs.current == 'true' && steps.dokploy.outputs.enabled == 'true' && vars.ROLLOUT_VERIFY != 'off' && vars.ROLLOUT_VERIFY != 'ssh'
        env:
          API_URL: ${{ vars.API_PUBLIC_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Falta a variável API_PUBLIC_URL no environment staging (a origem pública da API, ex. https://api-staging.intrajetto.com): sem ela o run não prova que o staging serve este build (docs/deploy.md, \"Conferir a convergência\"). Para pular de propósito: ROLLOUT_VERIFY=off."
            exit 1
          fi
          node .github/scripts/wait-for-version.mjs

      # The promote's check (see there), opt-in on staging with
      # ROLLOUT_VERIFY=ssh: the Swarm tasks themselves, over SSH with a key
      # restricted to infra/scripts/verify-rollout.sh.
      - name: Wait for the rollout to converge
        id: verify-ssh
        if: steps.head.outputs.current == 'true' && steps.dokploy.outputs.enabled == 'true' && vars.ROLLOUT_VERIFY == 'ssh'
        env:
          DIGEST: ${{ needs.build-and-push.outputs.api_digest }}
          SERVICE: ${{ vars.SWARM_API_SERVICE }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_VERIFY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$DIGEST" ] || missing="$missing DIGEST"
          [ -n "$SERVICE" ] || missing="$missing vars.SWARM_API_SERVICE"
          [ -n "$SSH_HOST" ] || missing="$missing secrets.DEPLOY_SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing secrets.DEPLOY_SSH_USER"
          [ -n "$SSH_KEY" ] || missing="$missing secrets.DEPLOY_VERIFY_SSH_KEY"
          [ -n "$SSH_KNOWN_HOSTS" ] || missing="$missing secrets.DEPLOY_SSH_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Faltam${missing}: sem eles o run não prova que o Swarm terminou o rollout (docs/deploy.md, \"Conferir a convergência\"). Sem SSH, apague ROLLOUT_VERIFY (vale a conferência pela liveness pública); para pular de propósito: ROLLOUT_VERIFY=off."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/verify_key
          chmod 600 ~/.ssh/verify_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/verify_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$SSH_USER@$SSH_HOST" "$SERVICE ghcr.io/trajetto-organization/trajetto-api@${DIGEST}"
          echo "trajetto-api: ${SERVICE} convergiu para ${DIGEST}." >> "$GITHUB_STEP_SUMMARY"

      - name: Say the rollout was not verified
        if: steps.head.outputs.current == 'true' && steps.dokploy.outputs.enabled == 'true' && vars.ROLLOUT_VERIFY == 'off'
        run: |
          echo "::warning::ROLLOUT_VERIFY=off: o run não confere se o Swarm terminou o rollout ou o reverteu."
          echo "Rollout de staging NÃO verificado (ROLLOUT_VERIFY=off)." >> "$GITHUB_STEP_SUMMARY"

      # The marker the PR check and the promote require, as in trajetto-ui:
      # written last, so only a build that passed the scan (build-and-push),
      # became staging's tags, was deployed by Dokploy and — when the check
      # runs — was served by the staging API gets it. A build whose scan,
      # deploy or check failed, or whose run was superseded, has `sha-<sha>`
      # in GHCR but no `staged-<sha>`. Both images, on the digests deployed.
      # Not gated on Dokploy being configured: before it exists the tags are
      # all there is, as in the web.
      - name: Mark this build as staged
        if: steps.head.outputs.current == 'true'
        env:
          API_DIGEST: ${{ needs.build-and-push.outputs.api_digest }}
          AI_DIGEST: ${{ needs.build-and-push.outputs.ai_digest }}
        run: |
          bash .github/scripts/ghcr.sh tag \
            "ghcr.io/trajetto-organization/trajetto-api:staged-${GITHUB_SHA::7}" \
            "ghcr.io/trajetto-organization/trajetto-api@${API_DIGEST}"
          bash .github/scripts/ghcr.sh tag \
            "ghcr.io/trajetto-organization/trajetto-ai:staged-${GITHUB_SHA::7}" \
            "ghcr.io/trajetto-organization/trajetto-ai@${AI_DIGEST}"
          echo "staged-${GITHUB_SHA::7}: trajetto-api → ${API_DIGEST}, trajetto-ai → ${AI_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      # A Dokploy deploy that failed left Swarm on the old spec, so its tag
      # goes back to what staging still runs: the next run's AI skip compares
      # against it, and a manual Deploy in the panel must not pull a build
      # that never came up. Only a failed Dokploy step, never a failed check:
      # a check that timed out may sit on a build that did converge.
      - name: Put the staging tags back after a failed deploy
        if: steps.head.outputs.current == 'true' && steps.dokploy.outputs.enabled == 'true' && failure()
        env:
          PREVIOUS_API: ${{ steps.current.outputs.api }}
          PREVIOUS_AI: ${{ steps.current.outputs.ai }}
          API_DEPLOY: ${{ steps.deploy-api.outcome }}
          AI_DEPLOY: ${{ steps.deploy-ai.outcome }}
        run: |
          restore() {
            if [ -z "$2" ]; then
              echo "::warning::$1:staging não existia antes deste run; fica onde está."
              return
            fi
            bash .github/scripts/ghcr.sh tag \
              "ghcr.io/trajetto-organization/$1:staging" "ghcr.io/trajetto-organization/$1@$2"
            echo "$1:staging voltou para $2 (o deploy falhou; o staging segue no build anterior)." >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "$AI_DEPLOY" = "failure" ]; then restore trajetto-ai "$PREVIOUS_AI"; fi
          if [ "$API_DEPLOY" = "failure" ]; then restore trajetto-api "$PREVIOUS_API"; fi

  # ── Pull request into main: is there a validated build to promote? ──

  # The merge promotes the build staging DEPLOYED for the PR head; without it
  # the promote fails AFTER the merge. This says so on the PR instead, while
  # it can still be fixed. The image alone (`sha-<sha>`) is not enough: it is
  # in GHCR as soon as the build pushed it, also when the scan, the staging
  # deploy or its check failed afterwards — a build staging never ran could
  # be merged and promoted. `staged-<sha>` is written by deploy-staging only
  # after all of that passed, on the digests it deployed (as in trajetto-ui).
  # It waits up to 45 min, because the PR usually opens while staging is
  # still building and deploying that same commit. (The job keeps its name:
  # branch protection requires the check by it.)
  #
  # A head that only changes documentation (*.md, docs/**) since a commit
  # staging deployed passes on that commit's marker: the merge promotes that
  # build, which has the same image content. Such a commit may carry
  # [skip ci] (docs/deploy.md, "Commits só de documentação"). The rule lives
  # in .github/scripts/staged-build.sh, which the promote runs too.
  staging-image:
    name: The PR head was built on staging
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    # Waits up to 45 min by design (90 rounds of 30 s).
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read

    steps:
      # The scripts, and the history the documentation rule compares
      # (blobless: commits and trees only).
      - name: Checkout the PR head (history and scripts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          sparse-checkout: .github/scripts

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # staged-build.sh: 0 = covered (the head's own marker, or the
      # documentation rule); 3 or 4 = not yet, keep waiting (4 is a marker on
      # an older build of the same commit, which a rebuild's deploy
      # rewrites); anything else = GHCR or git failed, and so does this.
      - name: Wait for the staging deploy of the PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short="${HEAD_SHA::7}"
          why=""
          for attempt in $(seq 1 90); do
            code=0
            why=$(bash .github/scripts/staged-build.sh "$HEAD_SHA" 2>&1 > /dev/null) || code=$?
            case "$code" in
              0)
                printf '%s\n' "$why"
                echo "O merge promove exatamente um build que o staging rodou (resumo deste job)." >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              3 | 4)
                # A GHCR retry (ghcr.sh) stays visible while this waits.
                grep '^::warning::' <<< "$why" || true
                ;;
              *)
                printf '%s\n' "$why"
                exit "$code"
                ;;
            esac
            echo "tentativa ${attempt}/90: ainda sem staged-${short} ($(printf '%s' "$why" | tail -n 1))"
            sleep 30
          done
          echo "::error::O commit ${HEAD_SHA} não tem o marcador staged-${short}: o staging não construiu, não implantou ou não conferiu esse build (ou o run de staging dele ainda não terminou, ou foi superado por um commit mais novo), e ele muda mais que documentação desde o último commit que o staging rodou. Envie-o para a branch staging, espere o pipeline de staging ficar verde e rode este check de novo. O merge em main só promove o que o staging rodou (docs/deploy.md). Último motivo: $(printf '%s' "$why" | tail -n 1)"
          exit 1

  # ── Production ──

  # After the promote, never before: the release (tag, CHANGELOG, GitHub
  # Release) is the only irreversible step, and it announces a version that
  # is actually live. Its commit carries [skip ci], so it does not start
  # another promote.
  release:
    name: Release (semantic-release)
    runs-on: ubuntu-24.04
    needs: promote-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Measured ~2 min.
    timeout-minutes: 20
    permissions:
      contents: write # create the tag and the release, and commit the CHANGELOG
      issues: write # comment on the issues closed by this version
      pull-requests: write # comment on the PRs included in this version

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # semantic-release needs the full history: it finds the last tag and reads
          # the commits since then to decide whether the version goes up by patch,
          # minor or major. With the default shallow clone there is nothing to
          # analyse and no release is ever created.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # Production promotion: on the merge into main (the build staging
  # validated for the merged commit) or by the manual button (a rollback to
  # an older immutable tag). No `needs`: the image has been in the registry
  # since its staging build.
  #
  # Promoting means moving the `stable` tag to the image being shipped and only
  # then asking Dokploy to redeploy production. The production Applications
  # are pinned to `stable`: a redeploy pulls the tag again and the Swarm
  # service resolves it to its digest, so the moved tag is what runs (see
  # docs/deploy.md).
  promote-production:
    name: Promote to production
    runs-on: ubuntu-24.04
    # Run workflow promotes only from main: on staging the same button runs
    # the staging road instead (build-and-push, deploy-staging).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      packages: write

    # Required reviewers on this environment (Settings → Environments →
    # production) make every promote and rollback wait for an approval.
    environment: production
    # Counted from the approval: the release step up to 30 min, six Dokploy
    # attempts per service with pauses up to 160 s, and the rollout check.
    timeout-minutes: 120

    # One promote at a time, never cancelled midway: two would race on
    # `stable`, and the wait on a migration must not be cut off.
    concurrency:
      group: promote-production
      cancel-in-progress: false

    steps:
      # Which build ships. On a merge commit, its second parent: the PR head,
      # the commit staging built. On a fast-forward, the commit itself. A
      # squash or rebase merge creates a commit staging never built, and the
      # check below fails on it, by design. On the manual button, the typed
      # tag — through `env`, never as `${{ }}` inside `run:`: it is free
      # text typed into a form.
      - name: Resolve the build to promote
        id: target
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_TAG" in
              *[!a-z0-9-]* | "") tag="invalid" ;;
              *) tag="$INPUT_TAG" ;;
            esac
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "Promoção manual (rollback) de \`${tag}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          parents=""
          for attempt in 1 2 3; do
            if parents=$(gh api "repos/${REPO}/commits/${GITHUB_SHA}" --jq '[.parents[].sha] | join(" ")'); then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::A API do GitHub não respondeu os pais de ${GITHUB_SHA} depois de 3 tentativas: nada foi promovido. Não é um problema do código."
              exit 1
            fi
            echo "::warning::A API do GitHub falhou ao ler os pais de ${GITHUB_SHA} (tentativa ${attempt} de 3). De novo em $((attempt * 10))s."
            sleep $((attempt * 10))
          done
          read -r -a list <<< "$parents"
          case ${#list[@]} in
            2) candidate="${list[1]}"; how="segundo pai do merge commit ${GITHUB_SHA::7} (a cabeça do PR)" ;;
            1) candidate="$GITHUB_SHA"; how="o próprio commit (fast-forward)" ;;
            *) echo "::error::O commit ${GITHUB_SHA} tem ${#list[@]} pais; não sei qual build promover."; exit 1 ;;
          esac
          echo "tag=sha-${candidate::7}" >> "$GITHUB_OUTPUT"
          echo "commit=${candidate}" >> "$GITHUB_OUTPUT"
          echo "Commit a promover: \`${candidate::7}\`, ${how}." >> "$GITHUB_STEP_SUMMARY"

      # First, before anything is migrated, retagged or deployed. Only an
      # immutable build: `staging`/`stable` move under our feet.
      - name: Validate the tag to promote
        env:
          IMAGE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          if ! grep -Eq '^(sha|main)-[0-9a-f]{7,40}$' <<< "$IMAGE_TAG"; then
            echo "::error::image_tag precisa ser sha-<sha> (ou main-<sha>, builds antigos); recebido: '$IMAGE_TAG'"
            exit 1
          fi

      # Full history (blobless, scripts only): the documentation rule below
      # compares the merged commit with the commits staging ran.
      - name: Checkout the deploy script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          sparse-checkout: .github/scripts

      # The deploy and rollout scripts on the same Node as every other job.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A merge promotes only what staging actually ran: the build must carry
      # the `staged-<commit>` marker deploy-staging writes last, on the same
      # digests. The image alone is not enough — it is pushed before the
      # scan, and stays in GHCR when the scan, the staging deploy or its
      # check fails. The same rule as trajetto-ui.
      #
      # A commit that only changes documentation (*.md, docs/**) since a
      # commit staging ran is promoted with THAT commit's build — the same
      # image content — so a docs commit with [skip ci] at the tip of staging
      # no longer blocks the promote (.github/scripts/staged-build.sh, the
      # same rule as the PR check). Its output names the build every step
      # below promotes.
      #
      # A merge that lands while staging still deploys its head (possible
      # only if branch protection does not require the PR check) waits here,
      # up to 20 min, instead of failing into a re-run.
      #
      # The Run workflow (rollback) is exempt: it targets older builds, some
      # made before the marker existed, and a person approves the tag typed.
      - name: Check that staging ran this build
        id: staged
        env:
          EVENT: ${{ github.event_name }}
          TARGET_TAG: ${{ steps.target.outputs.tag }}
          CANDIDATE: ${{ steps.target.outputs.commit }}
        run: |
          if [ "$EVENT" != "push" ]; then
            echo "tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
            echo "Rollback por Run workflow: \`${TARGET_TAG}\` é promovido sem exigir o marcador staged-<7>." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          why=""
          for attempt in $(seq 1 40); do
            code=0
            why=$(bash .github/scripts/staged-build.sh "$CANDIDATE" 2>&1 > /dev/null) || code=$?
            case "$code" in
              0)
                printf '%s\n' "$why"
                exit 0
                ;;
              3 | 4)
                # A GHCR retry (ghcr.sh) stays visible while this waits.
                grep '^::warning::' <<< "$why" || true
                ;;
              *)
                printf '%s\n' "$why"
                exit "$code"
                ;;
            esac
            echo "tentativa ${attempt}/40: o staging ainda não rodou ${CANDIDATE::7} ($(printf '%s' "$why" | tail -n 1))"
            sleep 30
          done
          echo "::error::O staging nunca rodou ${CANDIDATE::7} (falta o marcador staged-${CANDIDATE::7} no digest de sha-${CANDIDATE::7}: o scan, o deploy de staging ou a conferência falhou), e o commit muda mais que documentação desde o último que o staging rodou. Nada foi promovido. Corrija em staging e faça o merge de novo. Último motivo: $(printf '%s' "$why" | tail -n 1)"
          exit 1

      # The promote never builds: no staging image for this commit means it
      # never went through staging, and nothing ships. "Does not exist" and
      # "GHCR did not answer" are told apart (ghcr.sh): only the first is
      # about the merge.
      - name: Check the build exists in GHCR
        env:
          IMAGE_TAG: ${{ steps.staged.outputs.tag }}
        run: |
          found=$(bash .github/scripts/ghcr.sh digest "ghcr.io/trajetto-organization/trajetto-api:${IMAGE_TAG}")
          if [ -z "$found" ]; then
            echo "::error::ghcr.io/trajetto-organization/trajetto-api:${IMAGE_TAG} não existe. O commit não passou pelo pipeline de staging (ou o merge foi squash/rebase, que cria um commit que o staging nunca construiu). Use merge commit a partir de staging (docs/deploy.md)."
            exit 1
          fi

      # Informational, never blocking: a rollback promotes an OLDER build on
      # purpose. The summary says whether the build going out is the one
      # staging is running. GHCR not answering only leaves a "?" here: the
      # steps that move tags read again, strictly.
      - name: Compare with what staging runs
        env:
          IMAGE_TAG: ${{ steps.staged.outputs.tag }}
        run: |
          promoted=$(bash .github/scripts/ghcr.sh digest "ghcr.io/trajetto-organization/trajetto-api:${IMAGE_TAG}") || promoted="?"
          staging=$(bash .github/scripts/ghcr.sh digest ghcr.io/trajetto-organization/trajetto-api:staging) || staging="?"
          if [ "$promoted" = "$staging" ]; then
            echo "${IMAGE_TAG} é o build que está em staging." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::${IMAGE_TAG} não é o build que está em staging agora (rollback, ou staging já andou)."
            echo "${IMAGE_TAG} NÃO é o build de staging (${staging})." >> "$GITHUB_STEP_SUMMARY"
          fi

      # As on staging: all four secrets deploy, none skips with a notice
      # (`stable` still moves below, and the first Dokploy deploy will run
      # it), some is a mistake and fails. Before the migrations: they run
      # only for a production that deploys.
      - name: Is the production deploy configured?
        id: dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_API_APPLICATION_ID: ${{ secrets.DOKPLOY_API_APPLICATION_ID }}
          DOKPLOY_MIGRATE_APPLICATION_ID: ${{ secrets.DOKPLOY_MIGRATE_APPLICATION_ID }}
        run: |
          missing=""
          [ -n "$DOKPLOY_URL" ] || missing="$missing DOKPLOY_URL"
          [ -n "$DOKPLOY_API_KEY" ] || missing="$missing DOKPLOY_API_KEY"
          [ -n "$DOKPLOY_API_APPLICATION_ID" ] || missing="$missing DOKPLOY_API_APPLICATION_ID"
          [ -n "$DOKPLOY_MIGRATE_APPLICATION_ID" ] || missing="$missing DOKPLOY_MIGRATE_APPLICATION_ID"
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$missing" = " DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_API_APPLICATION_ID DOKPLOY_MIGRATE_APPLICATION_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy de produção pulado: o environment production ainda não tem DOKPLOY_URL, DOKPLOY_API_KEY, DOKPLOY_API_APPLICATION_ID e DOKPLOY_MIGRATE_APPLICATION_ID (docs/deploy.md). A tag stable já aponta para este build."
            echo "Deploy de produção **pulado**: Dokploy ainda não configurado. A tag \`stable\` já aponta para este build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Configuração parcial do Dokploy no environment production: faltam${missing} (docs/deploy.md; DOKPLOY_MIGRATE_APPLICATION_ID é o id da Application trajetto-api-migrate, seção Migrations)."
            exit 1
          fi

      # The release step, ONCE, with the release image of the build being
      # promoted, before `stable` moves and before production is redeployed,
      # and only when production's database has not applied it yet:
      # `trajetto-api-migrate:stable-applied` names the last one that
      # FINISHED here (moved only after the step succeeded, below). The same
      # digest means the same migrations and seeds already ran (a build that
      # changed none of them reuses the release image: migrate-source.sh).
      #
      # A build with no release image is skipped only when it provably
      # predates it: a `main-<sha>` build, or a Run workflow rollback to a
      # commit whose tree has no infra/scripts/schema-guard.ts (it came with
      # the release image). Production has applied every migration such a
      # build knows. Any other build without one lost its push (the API
      # image is pushed first): that fails here, before `stable` moves,
      # instead of shipping a build whose replicas refuse the database.
      # GHCR not answering is not "no image": ghcr.sh fails the step.
      - name: Do the migrations need to run?
        id: migrations
        if: steps.dokploy.outputs.enabled == 'true'
        env:
          EVENT: ${{ github.event_name }}
          IMAGE_TAG: ${{ steps.staged.outputs.tag }}
        run: |
          digest=$(bash .github/scripts/ghcr.sh digest "ghcr.io/trajetto-organization/trajetto-api-migrate:${IMAGE_TAG}")
          if [ -z "$digest" ]; then
            presplit=false
            case "$IMAGE_TAG" in
              main-*) presplit=true ;;
              sha-*)
                if [ "$EVENT" = workflow_dispatch ] \
                  && commit=$(git rev-parse --verify --quiet "${IMAGE_TAG#sha-}^{commit}") \
                  && [ -z "$(git ls-tree --name-only "$commit" -- infra/scripts/schema-guard.ts)" ]; then
                  presplit=true
                fi
                ;;
            esac
            if [ "$presplit" != true ]; then
              echo "::error::ghcr.io/trajetto-organization/trajetto-api-migrate:${IMAGE_TAG} não existe, e o build é posterior à imagem de migração (o push dela falhou). Nada foi promovido: rode o pipeline de staging desse commit de novo."
              exit 1
            fi
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${IMAGE_TAG} é anterior à imagem de migração (trajetto-api-migrate): a produção já aplicou todas as migrations desse build, e a etapa de release não roda."
            echo "Migrations: etapa pulada; ${IMAGE_TAG} é anterior à imagem de migração." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          applied=$(bash .github/scripts/ghcr.sh digest ghcr.io/trajetto-organization/trajetto-api-migrate:stable-applied)
          if [ -n "$applied" ] && [ "$applied" = "$digest" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Migrations: o banco de produção já aplicou trajetto-api-migrate:${IMAGE_TAG} (${digest}); a etapa de release não roda."
            echo "Migrations: sem mudança; o banco de produção já aplicou ${digest}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # The production release Application runs `:stable`.
      - name: Move the release image's stable tag to this build
        if: steps.migrations.outputs.run == 'true'
        env:
          IMAGE_TAG: ${{ steps.staged.outputs.tag }}
          MIGRATE_DIGEST: ${{ steps.migrations.outputs.digest }}
        run: |
          bash .github/scripts/ghcr.sh tag \
            ghcr.io/trajetto-organization/trajetto-api-migrate:stable \
            "ghcr.io/trajetto-organization/trajetto-api-migrate@${MIGRATE_DIGEST}"
          echo "trajetto-api-migrate:stable → ${IMAGE_TAG} (${MIGRATE_DIGEST})" >> "$GITHUB_STEP_SUMMARY"

      # As on staging (dokploy-release.mjs): Dokploy redeploys the
      # production Application trajetto-api-migrate and the run waits until
      # Swarm reports the step finished or failed. A failing migration fails
      # HERE: `stable` of the API and the AI does not move, nothing is
      # redeployed, and the running replicas never notice. Secrets of the
      # production environment; setup in docs/deploy.md ("Migrations").
      - name: Run the database migrations on production (Dokploy)
        if: steps.migrations.outputs.run == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_MIGRATE_APPLICATION_ID }}
          DOKPLOY_APP_LABEL: trajetto-api-migrate
          RELEASE_IMAGE: ghcr.io/trajetto-organization/trajetto-api-migrate:stable
        run: node .github/scripts/dokploy-release.mjs

      - name: Record the migrations as applied on production
        if: steps.migrations.outputs.run == 'true'
        env:
          MIGRATE_DIGEST: ${{ steps.migrations.outputs.digest }}
        run: |
          bash .github/scripts/ghcr.sh tag \
            ghcr.io/trajetto-organization/trajetto-api-migrate:stable-applied \
            "ghcr.io/trajetto-organization/trajetto-api-migrate@${MIGRATE_DIGEST}"
          echo "trajetto-api-migrate:stable-applied → ${MIGRATE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      # `imagetools create` retags server-side, without pulling or rebuilding,
      # so production runs the exact bytes that were validated.
      #
      # Unconditional: the API Application runs `:stable`, so THIS is
      # what ships. The digest is read first, from the immutable tag: it is
      # what `stable` moves to, what the rollout check waits for and what a
      # later rollback or incident review needs to know was live.
      - name: Promote image to stable
        id: stable
        env:
          IMAGE_TAG: ${{ steps.staged.outputs.tag }}
        run: |
          digest=$(bash .github/scripts/ghcr.sh digest "ghcr.io/trajetto-organization/trajetto-api:${IMAGE_TAG}")
          if [ -z "$digest" ]; then
            echo "::error::ghcr.io/trajetto-organization/trajetto-api:${IMAGE_TAG} sumiu do GHCR entre a conferência e a promoção."
            exit 1
          fi
          bash .github/scripts/ghcr.sh tag \
            ghcr.io/trajetto-organization/trajetto-api:stable \
            "ghcr.io/trajetto-organization/trajetto-api@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "trajetto-api:stable → ${IMAGE_TAG} (${digest})" >> "$GITHUB_STEP_SUMMARY"

      # The AI service moves with the API too (ADR 0010). A build older than
      # the service has no trajetto-ai image: a rollback to it keeps the AI
      # where it is instead of failing the promote.
      #
      # As on staging, the AI is redeployed only when its digest changes: a
      # build whose infra/ai-ocr did not change reuses the AI image of an
      # earlier one (build-and-push), and production already runs it.
      # `force_ai_build` on the Run workflow redeploys it anyway. What
      # `stable` named before is kept, so a failed AI deploy can put it back.
      - name: Promote the AI image to stable
        id: ai-stable
        env:
          IMAGE_TAG: ${{ steps.staged.outputs.tag }}
          FORCE: ${{ inputs.force_ai_build }}
        run: |
          image="ghcr.io/trajetto-organization/trajetto-ai:${IMAGE_TAG}"
          digest=$(bash .github/scripts/ghcr.sh digest "$image")
          previous=$(bash .github/scripts/ghcr.sh digest ghcr.io/trajetto-organization/trajetto-ai:stable)
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          if [ -z "$digest" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${image} não existe (build anterior ao serviço de IA local); trajetto-ai:stable não mudou."
            exit 0
          fi
          bash .github/scripts/ghcr.sh tag \
            ghcr.io/trajetto-organization/trajetto-ai:stable \
            "ghcr.io/trajetto-organization/trajetto-ai@${digest}"
          echo "trajetto-ai:stable → ${IMAGE_TAG} (${digest})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FORCE" != "true" ] && [ "$digest" = "$previous" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::trajetto-ai: a produção já roda ${digest}; a IA não é reimplantada. Para forçar: Run workflow na main com force_ai_build."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # As on staging: one Dokploy Application per service, now on `:stable`
      # (moved above). Each step follows the deployment Dokploy creates for
      # this call and fails the run if Dokploy could not deploy at all (an
      # image it cannot pull, a wrong id). Its `done` only means the Swarm
      # manager ACCEPTED the spec: the API's rollout is checked below.
      # Secrets of the production environment.
      - name: Deploy the AI service to production (Dokploy)
        id: deploy-ai
        if: steps.dokploy.outputs.enabled == 'true' && steps.ai-stable.outputs.deploy == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_AI_APPLICATION_ID }}
          DOKPLOY_APP_LABEL: trajetto-ai
          DOKPLOY_OPTIONAL: "true"
        run: node .github/scripts/dokploy-deploy.mjs

      - name: Deploy to production (Dokploy)
        if: steps.dokploy.outputs.enabled == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_API_APPLICATION_ID }}
          DOKPLOY_APP_LABEL: trajetto-api
        run: node .github/scripts/dokploy-deploy.mjs

      # The no-SSH proof, opt-in in production (ROLLOUT_VERIFY=http in the
      # production environment): the public API's /health/liveness must
      # answer the promoted commit for 90 s (wait-for-version.mjs, as on
      # staging). The commit is the tag's: `sha-<7>` is all a promote knows,
      # and the script takes a prefix. A rollback to a build older than the
      # version in the liveness never answers one: use the SSH check for it.
      - name: Wait for the API to serve the promoted build
        if: steps.dokploy.outputs.enabled == 'true' && vars.ROLLOUT_VERIFY == 'http'
        env:
          API_URL: ${{ vars.API_PUBLIC_URL }}
          IMAGE_TAG: ${{ steps.staged.outputs.tag }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Falta a variável API_PUBLIC_URL no environment production (a origem pública da API): sem ela o run não prova que a produção serve este build (docs/deploy.md, \"Conferir a convergência\")."
            exit 1
          fi
          EXPECTED_SHA="${IMAGE_TAG#*-}" node .github/scripts/wait-for-version.mjs

      # The proof the promote shipped, and the default in production. Swarm
      # rolls a failing image back on its own (failure_action: rollback) and
      # the old build keeps serving — a green run with nothing promoted. This
      # waits on the manager, through an SSH key restricted to
      # infra/scripts/verify-rollout.sh (read-only), until the API service
      # runs the promoted digest on every replica with the update completed,
      # and fails on a rollback or at the timeout. ROLLOUT_VERIFY=http trades
      # it for the public check above; `off` is the explicit opt-out, logged
      # in the summary.
      - name: Wait for the rollout to converge
        if: steps.dokploy.outputs.enabled == 'true' && vars.ROLLOUT_VERIFY != 'off' && vars.ROLLOUT_VERIFY != 'http'
        env:
          DIGEST: ${{ steps.stable.outputs.digest }}
          SERVICE: ${{ vars.SWARM_API_SERVICE }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_VERIFY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$DIGEST" ] || missing="$missing DIGEST"
          [ -n "$SERVICE" ] || missing="$missing vars.SWARM_API_SERVICE"
          [ -n "$SSH_HOST" ] || missing="$missing secrets.DEPLOY_SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing secrets.DEPLOY_SSH_USER"
          [ -n "$SSH_KEY" ] || missing="$missing secrets.DEPLOY_VERIFY_SSH_KEY"
          [ -n "$SSH_KNOWN_HOSTS" ] || missing="$missing secrets.DEPLOY_SSH_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Faltam${missing}: sem eles o run não prova que o Swarm terminou o rollout (docs/deploy.md, \"Conferir a convergência\"). Para pular de propósito: ROLLOUT_VERIFY=off."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/verify_key
          chmod 600 ~/.ssh/verify_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/verify_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$SSH_USER@$SSH_HOST" "$SERVICE ghcr.io/trajetto-organization/trajetto-api@${DIGEST}"
          echo "trajetto-api: ${SERVICE} convergiu para ${DIGEST}." >> "$GITHUB_STEP_SUMMARY"

      - name: Say the rollout was not verified
        if: steps.dokploy.outputs.enabled == 'true' && vars.ROLLOUT_VERIFY == 'off'
        run: |
          echo "::warning::ROLLOUT_VERIFY=off: o run não confere se o Swarm terminou o rollout ou o reverteu. Confira 'docker service ps --no-trunc <appName da Application da API>' no host."
          echo "Rollout de produção NÃO verificado (ROLLOUT_VERIFY=off)." >> "$GITHUB_STEP_SUMMARY"

      # A failed AI deploy left Swarm on the old spec: `trajetto-ai:stable`
      # goes back to what production still runs, or the next promote of the
      # same AI digest would skip a deploy that never happened. The API's
      # `stable` is not touched here: a failed promote is fixed by promoting
      # again (or rolling back), which moves it on purpose.
      - name: Put the AI's stable tag back after a failed deploy
        if: steps.dokploy.outputs.enabled == 'true' && failure() && steps.deploy-ai.outcome == 'failure'
        env:
          PREVIOUS_AI: ${{ steps.ai-stable.outputs.previous }}
        run: |
          if [ -z "$PREVIOUS_AI" ]; then
            echo "::warning::trajetto-ai:stable não existia antes desta promoção; fica onde está."
            exit 0
          fi
          bash .github/scripts/ghcr.sh tag \
            ghcr.io/trajetto-organization/trajetto-ai:stable \
            "ghcr.io/trajetto-organization/trajetto-ai@${PREVIOUS_AI}"
          echo "trajetto-ai:stable voltou para ${PREVIOUS_AI} (o deploy da IA falhou; a produção segue no build anterior)." >> "$GITHUB_STEP_SUMMARY"
