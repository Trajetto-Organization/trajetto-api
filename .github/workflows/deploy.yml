name: Test, Build and Deploy Backend

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # The run button is the PROMOTE-to-production trigger.
  #
  # `image_tag` is what gets promoted. `latest` is whatever the newest main
  # build produced — fine when nothing has landed since staging was validated.
  # Pin `main-<sha>` to promote exactly the build that was checked, even if
  # main has moved on in the meantime.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to promote to production"
        required: true
        default: "latest"

env:
  # Common environment variables for all jobs
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  RABBITMQ_URL: amqp://guest:guest@localhost:5672
  REDIS_URL: redis://localhost:6379
  HTTP_REQUEST: http://localhost:3000
  API_HTTP_REQUEST: http://localhost:3333
  JWT_SECRET: test-jwt-secret-key-for-github-actions-only
  JWT_SECRET_REFRESH_TOKEN: test-jwt-refresh-secret-key-for-github-actions-only
  EVOLUTION_API_URL: http://localhost:8080/test
  EVOLUTION_API_KEY: test-evolution-api-key
  EVOLUTION_HTTP_REQUEST: http://localhost:3333
  TRAJETTO_WHATSAPP_BUSINESS_PHONE: 5524999999999
  TRAJETTO_WHATSAPP_INSTANCE_NAME: Trajetto-Business-Test
  UPLOAD_STORAGE_TYPE: local
  UPLOAD_LOCAL_PATH: ./tmp
  MASTER_USER_EMAIL: test-master@example.com
  MASTER_USER_INITIAL_PASSWORD: test-master-password-ci-only

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 30s
          --health-timeout 30s
          --health-retries 5
        ports:
          - 5672:5672
          - 15672:15672

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile base (node:22.21.1-alpine), the release job and
          # the local environment. Node 20 left support in April 2026 and does not
          # satisfy the engine required by part of the chain (semantic-release
          # requires ^22.14.0 || >=24.10.0).
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # First check of all, because it is the cheapest one. There is no point
      # spending minutes on tsc and the test suite if the code is not even
      # formatted.
      - name: Lint
        run: yarn lint:check

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Type-check
        run: yarn typecheck

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done'
          timeout 60 bash -c 'until nc -z localhost 5672; do sleep 1; done'
          timeout 60 bash -c 'until nc -z localhost 6379; do sleep 1; done'

      - name: Create tmp directory
        run: mkdir -p src/tmp

      - name: Run unit tests
        run: yarn test --run --reporter=basic

      - name: Run E2E tests
        run: yarn test:e2e --run --reporter=basic

  release:
    name: Release (semantic-release)
    runs-on: ubuntu-latest
    # Depends on the build TOO, not only on the checks. Running in parallel, a
    # failing build-and-push did not hold the release back: the tag, the
    # CHANGELOG and the GitHub Release went out announcing a version whose
    # image never reached the registry. The release is the last step precisely
    # because it is the only irreversible one.
    needs: [test, build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write # create the tag and the release, and commit the CHANGELOG
      issues: write # comment on the issues closed by this version
      pull-requests: write # comment on the PRs included in this version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # semantic-release needs the full history: it finds the last tag and reads
          # the commits since then to decide whether the version goes up by patch,
          # minor or major. With the default shallow clone there is nothing to
          # analyse and no release is ever created.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: test
    # Push only: the dispatch is the PROMOTE button, and it should merely tell
    # the orchestrator to pull the image already built and validated in this
    # push. Rebuilding on dispatch wastes minutes and, worse, could publish an
    # image different from the one that passed the quality gate, in case main
    # moved in the meantime.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trajetto-organization/trajetto-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

  # Staging redeploys on its own, with no approval: that is the whole point of
  # having it. Every merge into main lands here first, and the environment is
  # cheap to break.
  #
  # The API can share ONE image between staging and production because all of
  # its configuration is read at runtime — only the container env differs.
  # Gated on the `STAGING_ENABLED` repository variable so this whole path stays
  # dormant until the environment actually exists. Without the guard, every
  # merge into main would run this job, curl an empty webhook URL and paint the
  # run red — and a pipeline that is always red is a pipeline nobody reads.
  #
  # To turn it on: create the Staging environment and its webhook secret, then
  # set the repository variable STAGING_ENABLED to `true`
  # (Settings > Secrets and variables > Actions > Variables).
  #
  # `vars` is used instead of checking the secret directly because the `secrets`
  # context is not available in a job-level `if`.
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && vars.STAGING_ENABLED == 'true'

    # Points the stack at the `latest` tag, so it always follows main.
    environment: Staging

    steps:
      - name: Trigger staging redeploy
        run: |
          curl --fail-with-body --retry 3 --proto '=https' --tlsv1.2 -X POST "${{ secrets.PORTAINER_STAGING_WEBHOOK_URL }}"

  # Production promotion. No `needs`: it depends on no job of this run — the
  # image has been in the registry since its own push.
  #
  # Promoting means moving the `stable` tag to the image being shipped and only
  # then telling production to pull. The production stack is pinned to `stable`,
  # never to `latest`: pinned to `latest` any redeploy would drag in whatever
  # main built most recently, which defeats the point of a promotion.
  promote-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write

    # The line below enables manual approval on GitHub.
    environment: Production

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `imagetools create` retags server-side, without pulling or rebuilding,
      # so production runs the exact bytes that staging validated.
      #
      # Skipped until STAGING_ENABLED is set, because the production stack is
      # still pinned to `latest` today. Retagging before the stack is moved to
      # `stable` would achieve nothing, and a failure here would stop the
      # webhook below from firing — breaking a deploy path that works.
      - name: Promote image to stable
        if: vars.STAGING_ENABLED == 'true'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/trajetto-organization/trajetto-api:stable \
            ghcr.io/trajetto-organization/trajetto-api:${{ inputs.image_tag }}

      - name: Deploy to Portainer via Webhook
        run: |
          curl --fail-with-body --retry 3 --proto '=https' --tlsv1.2 -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
