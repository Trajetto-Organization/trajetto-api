version: "3.8"

services:
  trajetto-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      mode: replicated
      replicas: 1 # Essential for preventing data corruption in large volumes locally
      update_config:
        parallelism: 1
        order: stop-first # Ensures the old device lowers the volume before the new one does
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any # It always restarts if the process crashes
        delay: 5s
        max_attempts: 3
        # Without a window the attempt counter NEVER resets: Swarm's default is
        # 0, meaning "evaluate over the whole lifetime of the service". Three
        # restarts spread over three months exhaust the budget exactly like
        # three in fifteen seconds, and once exhausted Swarm stops recreating
        # the task permanently — including after the cause is long gone. With a
        # window, a task that survives two minutes gets its three attempts back.
        window: 120s
    networks:
      - minha_rede
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}",
        ]
      interval: 10s # Shorter interval for faster readiness detection in deployment
      timeout: 5s
      retries: 5
      start_period: 30s

  trajetto-redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    deploy:
      mode: replicated
      replicas: 1 # Stateful — single shared instance for all API replicas (pub/sub + rate-limit)
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s # See trajetto-database above.
    networks:
      - minha_rede
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ghcr.io/trajetto-organization/trajetto-api:latest
    # The default 10s SIGKILLs the process mid-shutdown; the graceful
    # sequence is bounded at 25s by the server watchdog.
    stop_grace_period: 40s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}?schema=public&connection_limit=10&pool_timeout=20
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}
      HTTP_REQUEST: ${HTTP_REQUEST}
      API_HTTP_REQUEST: ${API_HTTP_REQUEST}
      CLOUDINARY_LOGO_IMAGE: ${CLOUDINARY_LOGO_IMAGE}
      MASTER_USER_EMAIL: ${MASTER_USER_EMAIL}
      MASTER_USER_INITIAL_PASSWORD: ${MASTER_USER_INITIAL_PASSWORD}
      META_WHATSAPP_ACCESS_TOKEN: ${META_WHATSAPP_ACCESS_TOKEN}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID}
      META_WHATSAPP_TEMPLATE_NAME: ${META_WHATSAPP_TEMPLATE_NAME}
      META_WHATSAPP_API_VERSION: ${META_WHATSAPP_API_VERSION}
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_REFRESH_TOKEN: ${JWT_SECRET_REFRESH_TOKEN}
      RESEND_SECRET_KEY: ${RESEND_SECRET_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      UPLOAD_STORAGE_TYPE: ${UPLOAD_STORAGE_TYPE}
      UPLOAD_LOCAL_PATH: ${UPLOAD_LOCAL_PATH}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
    deploy:
      mode: replicated
      replicas: 2 # Horizontal scale — events propagate across replicas via Redis adapter
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
        monitor: 30s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s # See trajetto-database above.
      labels:
        - traefik.enable=true
        - traefik.http.routers.api.rule=Host(`trajettoapi.thorsolucoes.com.br`)
        - traefik.http.routers.api.entrypoints=websecure
        - traefik.http.routers.api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.api.priority=1
        - traefik.http.routers.api.service=api
        - traefik.http.services.api.loadbalancer.server.port=3333
        - traefik.http.services.api.loadbalancer.passHostHeader=true
        # Sticky sessions — pin each client to one replica so the Socket.IO
        # polling handshake stays consistent. The Redis adapter handles
        # cross-replica event propagation; sticky keeps the connection stable.
        - traefik.http.services.api.loadbalancer.sticky.cookie=true
        - traefik.http.services.api.loadbalancer.sticky.cookie.name=trajetto_api_affinity
        - traefik.http.services.api.loadbalancer.sticky.cookie.httponly=true
        - traefik.http.services.api.loadbalancer.sticky.cookie.secure=true
        # Readiness lives HERE, where being unready costs traffic instead of
        # costing the container. A replica whose database is unreachable stops
        # receiving requests and rejoins by itself once it answers 200 again.
        - traefik.http.services.api.loadbalancer.healthcheck.path=/health/readiness
        - traefik.http.services.api.loadbalancer.healthcheck.interval=10s
        - traefik.http.services.api.loadbalancer.healthcheck.timeout=5s
        - traefik.docker.network=minha_rede
    networks:
      - minha_rede
    depends_on:
      - trajetto-database
      - trajetto-redis
    # LIVENESS, not readiness — and the distinction is the whole point.
    #
    # In Swarm this probe is a KILL SWITCH: failing it does not take the
    # replica out of rotation, it destroys the task. Pointing it at readiness
    # made "the database is unreachable" mean "destroy every replica", and
    # both replicas observe the same database on the same interval, so they
    # cross the threshold seconds apart. A Postgres blip of two or three
    # minutes took the API from 2/2 to 0/2 — and the recreated containers ran
    # `prisma migrate deploy` at boot, failed against the same dead database,
    # burned all three restart attempts in under a minute and, with no window
    # on the policy, stayed down permanently. The outage outlived its cause by
    # however long it took a human to notice.
    #
    # /health/liveness answers "is this process alive", touching no
    # dependency. Whether a replica should receive traffic is answered by
    # Traefik against /health/readiness (see the labels above): a replica with
    # no database leaves the load balancer and comes back on its own, which is
    # what readiness is for.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3333/health/liveness', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      # Liveness waits for the process, not for its dependencies, so the long
      # grace period the readiness probe needed is no longer justified.
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  minha_rede:
    external: true
