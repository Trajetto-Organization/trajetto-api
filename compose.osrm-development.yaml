version: "3.8"

services:
  trajetto-osrm:
    build:
      context: ./osrm
      dockerfile: Dockerfile.development
    image: trajetto-osrm
    container_name: trajetto-osrm
    restart: unless-stopped
    ports:
      - "5000:5000"
    healthcheck:
      test: "curl -f -s 'http://localhost:5000/route/v1/driving/-47.9292,-15.7801;-49.2646,-16.6869' > /dev/null"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - osrm-network

networks:
  osrm-network:
    driver: bridge
